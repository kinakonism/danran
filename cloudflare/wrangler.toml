name = "danran-chat"
main = "worker.js"
compatibility_date = "2024-01-01"

# R2: 画像・動画の保存先（10GB無料・エッジ配信・動画シークOK）。
# Worker から env.danran_media で直接読み書き（クライアントにキー不要）。
[[r2_buckets]]
bucket_name = "danran-media"
binding = "danran_media"

# DBバックアップ(JSON.gz)の off-site 保管先（非公開＝/media のように公開配信しない）。
# bridge が日次でここへ PUT。Supabase でも mini 単独でもない3つ目のコピー。
[[r2_buckets]]
bucket_name = "danran-backups"
binding = "danran_backups"

# トンネルURL保存（Supabase REST API に依存しない・egress 超過影響なし）
[[kv_namespaces]]
binding = "TUNNEL_KV"
id = "21e925b82dcb487f9259a489e1886000"

[triggers]
# 15分おきにウォームアップ（Streamlit をスリープさせず、起動時の詰まり/暗転を防ぐ）
crons = ["*/15 * * * *"]
