<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>body{margin:0;padding:0;background:transparent;overflow:hidden}</style>
<script>
(function () {
  'use strict';

  var LP_MS = 600;
  var STORAGE_KEY = 'danran_session';
  var sessionSent = false;

  /* ── Streamlit コンポーネントプロトコル ── */
  function post(type, data) {
    window.parent.postMessage(Object.assign({ type: type }, data || {}), '*');
  }
  function ready()     { post('streamlit:componentReady', { apiVersion: 1 }); }
  function setHeight() { post('streamlit:setFrameHeight', { height: 0 }); }
  function setValue(v) { post('streamlit:setComponentValue', { value: v, dataType: 'json' }); }

  /* ── セッション管理 ── */
  function trySendSession() {
    if (sessionSent) return;
    try {
      var sid = localStorage.getItem(STORAGE_KEY);
      if (sid) {
        sessionSent = true;
        setValue({ type: 'session', sid: sid });
      }
    } catch (e) {}
  }

  /* ── 長押し検出 ── */
  function fireLp(msgId) {
    setValue({ type: 'lp', msgId: msgId, ts: Date.now() });
  }

  function attach(el, msgId) {
    if (el._lp) return;
    el._lp = true;
    var t, moved;
    el.addEventListener('touchstart', function () {
      moved = false;
      t = setTimeout(function () { if (!moved) fireLp(msgId); }, LP_MS);
    }, { passive: true });
    el.addEventListener('touchmove',   function () { moved = true; clearTimeout(t); }, { passive: true });
    el.addEventListener('touchend',    function () { clearTimeout(t); });
    el.addEventListener('touchcancel', function () { clearTimeout(t); });
    el.addEventListener('contextmenu', function (e) { e.preventDefault(); fireLp(msgId); });
  }

  function scan() {
    try {
      var doc = window.parent.document;
      var els = doc.querySelectorAll('[data-lp-msg]');
      for (var i = 0; i < els.length; i++) {
        if (!els[i]._lp) attach(els[i], els[i].getAttribute('data-lp-msg'));
      }
    } catch (e) { /* クロスオリジン等は無視 */ }
  }

  function setupObs() {
    try {
      var doc = window.parent.document;
      if (window._lpObs) window._lpObs.disconnect();
      window._lpObs = new MutationObserver(scan);
      window._lpObs.observe(doc.body, { childList: true, subtree: true });
    } catch (e) {}
    scan();
    setTimeout(scan, 500);
    setTimeout(scan, 1500);
  }

  /* ── Streamlit からの render イベント ── */
  window.addEventListener('message', function (e) {
    if (!e.data || e.data.type !== 'streamlit:render') return;
    var args = e.data.args || {};
    try {
      if (args.save_session)  localStorage.setItem(STORAGE_KEY, args.save_session);
      if (args.clear_session) localStorage.removeItem(STORAGE_KEY);
    } catch (ex) {}
    sessionSent = false; // 引数更新後に再確認
    setupObs();
    trySendSession();
  });

  /* 起動時 */
  ready();
  setHeight();
  trySendSession();
  setupObs();
})();
</script>
</head>
<body></body>
</html>
