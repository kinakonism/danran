<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>body{margin:0;padding:0;background:transparent;overflow:hidden}</style>
<script>
(function () {
  'use strict';

  var LP_MS = 500;

  /* ── Streamlit コンポーネントプロトコル ── */
  function post(type, data) {
    var msg = Object.assign({ type: type }, data || {});
    window.parent.postMessage(msg, '*');
  }
  function ready()           { post('streamlit:componentReady', { apiVersion: 1 }); }
  function setHeight(h)      { post('streamlit:setFrameHeight', { height: h }); }
  function setValue(v)       { post('streamlit:setComponentValue', { value: v, dataType: 'json' }); }

  /* ── 長押し検出 ── */
  function fireSignal(msgId) {
    setValue(msgId + '|' + Date.now());
  }

  function attach(el, msgId) {
    if (el._lpDone) return;
    el._lpDone = true;
    var t, moved;
    el.addEventListener('touchstart', function () {
      moved = false;
      t = setTimeout(function () { if (!moved) fireSignal(msgId); }, LP_MS);
    }, { passive: true });
    el.addEventListener('touchmove',   function () { moved = true; clearTimeout(t); }, { passive: true });
    el.addEventListener('touchend',    function () { clearTimeout(t); });
    el.addEventListener('touchcancel', function () { clearTimeout(t); });
    el.addEventListener('contextmenu', function (e) { e.preventDefault(); fireSignal(msgId); });
  }

  function scan() {
    try {
      var doc = window.parent.document;
      var els = doc.querySelectorAll('[data-lp-msg]');
      for (var i = 0; i < els.length; i++) {
        var el = els[i];
        if (!el._lpDone) attach(el, el.getAttribute('data-lp-msg'));
      }
    } catch (e) { /* クロスオリジン時は無視 */ }
  }

  function setupObserver() {
    try {
      var doc = window.parent.document;
      if (window._lpObs) window._lpObs.disconnect();
      window._lpObs = new MutationObserver(scan);
      window._lpObs.observe(doc.body, { childList: true, subtree: true });
    } catch (e) {}
    scan();
    setTimeout(scan, 400);
    setTimeout(scan, 1200);
  }

  /* Streamlit から render イベントを受け取ったら再初期化 */
  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'streamlit:render') {
      setupObserver();
    }
  });

  /* 起動時 */
  ready();
  setHeight(0);
  setupObserver();
})();
</script>
</head>
<body></body>
</html>
