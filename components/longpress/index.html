  function scan() {
    injectLpCSS();
    readConfig();   // DOM config を毎回読む（render 不要）
    try { splashWatchdog(); } catch (e) {}   // スプラッシュ固着の検知＆ restore 強制再送
    rememberRoom(); // 直前にいた部屋を記録（再接続で復帰するため）
    // ── スワイプ用 nav 関数を親ドキュメントに登録（毎 scan で上書き）──
    //   スワイプハンドラは古い iframe が所有している可能性があるため、
    //   この「生きている iframe」の stSetValue を親に常に最新登録しておく。
    //   死んだ iframe の setInterval は停止するので、最後に勝つのは必ずライブ iframe。
    try {
      window.parent.document._danranNav = function (action, ts) {
        stSetValue({ action: action, ts: ts });
      };
      // ナビ送信全般のライブ送信口（sendNav が使う）
      window.parent.document._danranSend = function (val) { stSetValue(val); };
    } catch (e) {}
    // ログアウト済み（ME が空）なら即座にヘッダー・カメラを除去して終了
    if (!ME) {
      removeHeader();
      removeCameraUI();
    }
    hideManageApp();
    ensureIosMeta();  // 最上位 head に apple-touch-icon / app タイトルを注入（ホーム画面追加用）
    forwardInviteIfAny();  // ?invite=CODE を実URLから読み取り Python へ（Worker 経由対策）
    fixStBottom();   // stBottom の display:none を強制解除
    alignCamBtn();   // 📷 ボタンを stChatInput の垂直中央に追従させる
    attachHdrButtons();     // Python レンダリングヘッダーのクリックハンドラを付与
    attachMyAvatarClick();  // 自分のアバタータップ → プロフィール画面
    attachRoomHandlers();   // ルームリストのカスタムHTMLボタンにイベントを付与
    injectSwSetup();        // Service Worker 登録（1回のみ）
    injectPushPrompt();     // 通知許可バナー（ルーム一覧・未許可時のみ・JSフォールバック）
    injectNotifSettings();  // 通知設定画面の UI（VIEW=notifications のときのみ）
    attachPushBannerClick(); // Python 描画バナーのクリックイベント付与
    setupInstallPrompt();   // Android: beforeinstallprompt キャプチャ（iOS は不可）
    try { setupRoomMenu(window.parent.document); } catch (e) {}            // チャットヘッダー ☰ メニュー
    try { setupMentionAutocomplete(window.parent.document); } catch (e) {}  // @ メンション補完（SendHook より先に張る）
    try { setupChatSendHook(window.parent.document); } catch (e) {}  // 送信検知フックを1回張る
    reconcileOptimistic();  // 楽観バブル: 本物が届いたら消す/失敗表示
    updateAiThinking();     // AI考え中バブル: 最後のメッセージ状態から表示/非表示を判定（ポーリング駆動）
    sweepToast();           // 期限切れトーストの掃除（死んだ iframe タイマー対策）
    scrollToLatestOnEnter(); // チャット入室時に最新メッセージへ即移動
    scrollTopOnEditEnter();  // 編集系画面に入った瞬間だけ先頭へ（変なスクロール継承を防ぐ）
    unreadBanner();          // 入室時に未読があれば上部に「N件の未読」バナーを出す
    applyFontScale();        // 文字サイズ設定(localStorage)を本文に適用
    try { setupSearchBar(window.parent.document); } catch (e) {}  // ヘッダー🔍検索（1回張る）
    try { applySearchHighlight(); } catch (e) {}  // 検索ヒットのハイライトを再適用（再描画対策）
    // JS フォールバック: Python ヘッダーが DOM にない場合のみ注入
    // （通常は Python が st.html() でレンダリングするため実行されない）
    try {
      if (ME && ACTIVE_ROOM && !window.parent.document.getElementById(HDR_ID)) {
        var isEdit = (VIEW === 'profile' || VIEW === 'room_edit' || VIEW === 'notifications' || VIEW === 'room_create');
        if (isEdit) { injectEditHeader(VIEW); } else { injectHeader(ACTIVE_ROOM, SHOW_ROOMS); }
      }
    } catch (e) {}
    // 長押し検出・スワイプ戻り・プルアップ更新は委譲方式で「生きた iframe」に毎回貼り直す
    try { setupLongPressDelegation(); } catch (e) {}
    try { setupSwipeBack(); } catch (e) {}
    try { setupPullRefresh(); } catch (e) {}
    // 引用返信バー（入力欄の真上に固定描画・スクロール/キーボード追従）
    try { injectReplyBar(); } catch (e) {}
    fillImageSlots();   // 画像スロットに永続 img を流し込む（再描画でも再ロードしない）
    // ★ タップ系は document capture の委譲方式で「生きた iframe」に毎 scan 貼り直す。
    //   旧方式（要素ごとに addEventListener）だと、画像ビューアを開いた後の再描画で
    //   iframe が再生成されると閉じるハンドラが死んだ iframe 所有になり「写真を開いたら
    //   閉じられず操作不能」になっていた。委譲なら開く/閉じるが常に生きた iframe で動く。
    try {
      var pDocT = window.parent.document;
      var prevTap = pDocT._danranTapDeleg;
      if (prevTap) pDocT.removeEventListener('click', prevTap, true);
      var onTap = function (e) {
        var t = e.target; if (!t) return;
        var pd = window.parent.document;
        // 画像ビューア表示中：✕/背景タップで確実に閉じる（開いた iframe が死んでいても閉じる）
        var viewer = pd.getElementById(IMG_VIEWER_ID);
        if (viewer) {
          if ((t.closest && t.closest('#_danran_img_close')) || t === viewer) {
            e.preventDefault(); e.stopPropagation();
            try { viewer.remove(); } catch (x) {}
          }
          return;   // 表示中は他のタップ処理をしない
        }
        // 全画面プロフィール表示中：同様に閉じる
        var prof = pd.getElementById(USER_PROFILE_ID);
        if (prof) {
          if ((t.closest && t.closest('#_danran_profile_close')) || t === prof) {
            e.preventDefault(); e.stopPropagation();
            try { prof.remove(); } catch (x) {}
          }
          return;
        }
        if (!t.closest) return;
        // 文字サイズボタン（設定画面）→ localStorage に保存して即適用
        var fsb = t.closest('[data-fontscale]');
        if (fsb) {
          e.preventDefault(); e.stopPropagation();
          try { localStorage.setItem('danran_fs', fsb.getAttribute('data-fontscale') || '1'); } catch (x) {}
          applyFontScale();
          return;
        }
        // ピンバーの ✕ → ピン解除
        var unp = t.closest('[data-unpin]');
        if (unp) {
          e.preventDefault(); e.stopPropagation();
          sendNav({ action: 'unpin_message', ts: Date.now() });
          return;
        }
        // プロフィール編集のプレビュー → 全画面プロフィール（押された時の見た目）
        var pv = t.closest('[data-preview-profile]');
        if (pv) {
          e.preventDefault(); e.stopPropagation();
          openUserProfile(pv.getAttribute('data-preview-name') || '',
                          pv.getAttribute('data-preview-avatar') || '',
                          pv.getAttribute('data-preview-cover') || '');
          return;
        }
        // リアクションのピルをタップ → 自分のリアクションをトグル（再度押すと外れる）。
        //   他人のメッセージのみ（自分のメッセージにはリアクションを付けない）。
        //   長押し（誰が押したか表示）直後の合成 click は無視。
        var rp = t.closest('[data-react-pill]');
        if (rp) {
          e.preventDefault(); e.stopPropagation();
          if (Date.now() - (pd._danranLpAt || 0) < 700) return;
          var rbubble = rp.closest('[data-lp-msg]');
          if (rbubble && rbubble.hasAttribute('data-lp-mine')) return;
          var rcont = rp.closest('[data-lp-react]');
          var rmid  = rcont ? rcont.getAttribute('data-lp-react') : '';
          var remo  = rp.getAttribute('data-emoji') || '';
          if (rmid && remo) toggleReactionAndUpdate(rmid, remo);
          return;
        }
        var lk = t.closest('[data-lp-link]');
        if (lk) { e.preventDefault(); e.stopPropagation(); showLinkMenu(lk.getAttribute('data-lp-link') || lk.href); return; }
        var jp = t.closest('[data-lp-jump]');
        if (jp) { e.preventDefault(); e.stopPropagation(); jumpToMessage(jp.getAttribute('data-lp-jump')); return; }
        var im = t.closest('[data-lp-image]');
        if (im) {
          e.preventDefault(); e.stopPropagation();
          if (Date.now() - (pd._danranLpAt || 0) < 700) return;   // 長押し直後の合成clickは無視
          openImageViewer(im.getAttribute('data-lp-image') || im.getAttribute('src'));
          return;
        }
        var sd = t.closest('[data-lp-sender]');
        if (sd) {
          e.preventDefault(); e.stopPropagation();
          if (Date.now() - (pd._danranLpAt || 0) < 700) return;
          openUserProfile(sd.getAttribute('data-lp-sender'), sd.getAttribute('data-lp-avatar'));
          return;
        }
      };
      pDocT.addEventListener('click', onTap, true);
      pDocT._danranTapDeleg = onTap;
    } catch (e) {}
  }

  /* ════════════════════════════════════════
   *  右スワイプで戻る（エッジスワイプジェスチャー）
   *
   *  touchstart/touchend を passive:true で監視（スクロール・タップに無干渉）。
   *  画面左 60% 以内から右へ 80px 以上のスワイプで前画面に戻る。
   *
   *  ★ 状態は pDoc._danranView / pDoc._danranSR から読む（最新を参照）。
   *
   *  ★ 最重要: nav 送信は pDoc._danranNav 経由（scan() が毎回ライブ iframe の
   *    stSetValue を登録する）。スワイプハンドラ自体は古い iframe が所有して
   *    いる可能性があり、その window から postMessage すると Streamlit に
   *    event.source 不一致で無視されるため。
   *
   *  ★ show_rooms は Python 側で st.session_state 管理（URL を変えない）。
   *    URL を変えると iOS Safari のネイティブ戻るジェスチャーと競合するため。
   * ════════════════════════════════════════ */
  function setupSwipeBack() {
    var pDoc, outerWin;
    try {
      pDoc     = window.parent.document;
      outerWin = (window.parent.parent && window.parent.parent !== window.parent)
                 ? window.parent.parent : window.parent;
    } catch (e) { return; }

    // ★ ドラッグ中は付け替えない（ジェスチャー途中で状態が飛ぶのを防ぐ）
    if (pDoc._danranSwipeDragging) return;

    // ★ 既存（古い＝死んだ iframe 由来かもしれない）リスナーを外し、この生きた iframe で
    //   貼り直す。一度だけ登録する旧方式だと iframe 再生成後にハンドラが凍結し
    //   「たまにスワイプで戻れない」原因になっていた（= 長押しと同じ生きた iframe 問題）。
    var prev = pDoc._danranSwipeReg;
    if (prev) {
      try {
        pDoc.removeEventListener('touchstart', prev.ts);
        pDoc.removeEventListener('touchmove',  prev.tm);
        pDoc.removeEventListener('touchend',   prev.te);
        pDoc.removeEventListener('touchcancel',prev.tc);
        pDoc.removeEventListener('click',      prev.ck, true);
        pDoc.removeEventListener('visibilitychange', prev.vc);
      } catch (e) {}
    }

    function screenWidth() {
      return outerWin.innerWidth || pDoc.documentElement.clientWidth || 375;
    }
    function getAppEl() {
      return pDoc.querySelector('[data-testid="stApp"]') || pDoc.querySelector('.stApp');
    }

    // nav 送信（生きた iframe 経由・800ms デバウンス。デバウンス値は pDoc 共有で
    // 付け替え直後の二重発火も防ぐ）
    function fireNav(action) {
      var now = Date.now();
      if (now - (pDoc._danranSwipeLastFire || 0) < 800) return;
      pDoc._danranSwipeLastFire = now;
      if (action === 'go_rooms') { try { showBackCover(); } catch (e) {} }  // 戻り遷移を覆う
      // ★ sendNav と同じ併送方式: ライブ iframe(_danranNav) と自分の stSetValue の両方で送る。
      //   同一 ts なので Python 側 dedup(_last_nav_ts) により1回だけ処理される。
      try { if (pDoc._danranNav) pDoc._danranNav(action, now); } catch (e) {}
      try { stSetValue({ action: action, ts: now }); } catch (e) {}
    }

    // ドラッグ transform をクリア（withTransition=true でバネ戻し）
    function clearDrag(el, withTransition) {
      if (!el) return;
      if (withTransition) {
        el.style.transition = 'transform 0.2s ease-out';
        el.style.transform  = 'translateX(0)';
        el.style.boxShadow  = '';
        setTimeout(function () {
          try { el.style.transition = ''; el.style.transform = ''; } catch (e) {}
        }, 240);
      } else {
        el.style.transition = 'none';
        el.style.transform  = '';
        el.style.boxShadow  = '';
      }
    }

    // 状態はこの関数のローカル（＝この生きた iframe 所有）。付け替えごとに新規。
    var _sx = null, _sy = null, _st = 0;
    var _dragEl   = null;    // ドラッグ中の .stApp
    var _dragging = false;   // 横ドラッグ確定
    var _canDrag  = false;   // チャット画面（ルーム選択でない）で開始したか

    function execSwipeFallback() {
      var view = pDoc._danranView !== undefined ? pDoc._danranView : VIEW;
      var sr   = pDoc._danranSR   !== undefined ? pDoc._danranSR   : SHOW_ROOMS;
      if (view === 'profile' || view === 'room_edit' ||
          view === 'notifications' || view === 'room_create') {
        fireNav('go_back');
      } else if ((view === 'chat' || view === '') && !sr) {
        fireNav('go_rooms');                              // ドラッグが効かなかった場合の保険
      }
      // ルーム選択中(sr=true)はトップ画面のため何もしない
    }

    // ── touchstart: 開始点記録 + ドラッグ可否判定 ──
    var onTs = function (e) {
      _sx = null; _dragging = false; _canDrag = false; _dragEl = null;
      pDoc._danranSwipeDragging = false;
      if (e.touches.length !== 1) return;
      if (pDoc.getElementById(IMG_VIEWER_ID)) return;   // 画像ビューア表示中はスワイプ戻り無効
      if (pDoc.getElementById('_danran_user_profile')) return;   // プロフィール全画面中も無効
      // 入力欄(stChatInput/stBottom)上ではスワイプ追跡しない＝テキスト選択/ペーストの長押しを邪魔しない
      if (e.target && e.target.closest &&
          e.target.closest('[data-testid="stChatInput"], [data-testid="stBottom"], textarea, input')) return;
      var t = e.touches[0];
      if (t.clientX > screenWidth() * 0.5) return;   // 左 50% 以内で開始
      _sx = t.clientX; _sy = t.clientY; _st = Date.now();
      var view = pDoc._danranView !== undefined ? pDoc._danranView : VIEW;
      var sr   = pDoc._danranSR   !== undefined ? pDoc._danranSR   : SHOW_ROOMS;
      // 指追従ドラッグはチャット画面のみ（ルーム選択＝トップ画面では無効）
      _canDrag = (view === 'chat' || view === '') && !sr;
    };

    // ── touchmove: 横ドラッグ確定後に .stApp を指追従 ──
    var onTm = function (e) {
      if (_sx === null) return;
      if (e.touches.length !== 1) return;
      var t  = e.touches[0];
      var dx = t.clientX - _sx;
      var dy = t.clientY - _sy;
      if (!_dragging) {
        if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { _sx = null; return; } // 縦スクロール
        if (dx > 12) {
          _dragging = true;
          pDoc._danranSwipeDragging = true;   // ドラッグ中は scan の付け替えを止める
          if (_canDrag) {
            _dragEl = getAppEl();
            if (_dragEl) _dragEl.style.transition = 'none';
          }
        } else { return; }
      }
      if (_canDrag && _dragEl) {
        if (e.cancelable) e.preventDefault();          // 縦スクロール・iOS戻りを抑止
        var x = dx < 0 ? 0 : dx;                        // 右方向のみ
        _dragEl.style.transform = 'translateX(' + x + 'px)';
        _dragEl.style.boxShadow = '-14px 0 28px rgba(0,0,0,0.45)';
      }
    };

    // ── touchend: 完了/キャンセル判定 ──
    var onTe = function (e) {
      pDoc._danranSwipeDragging = false;
      if (_sx === null) { _dragging = false; return; }
      if (e.changedTouches.length !== 1) { _sx = null; _dragging = false; return; }
      var t  = e.changedTouches[0];
      var dx = t.clientX - _sx;
      var dy = Math.abs(t.clientY - _sy);
      var dt = Date.now() - _st;
      _sx = null;
      var sw = screenWidth();

      // 指追従ドラッグ（チャット → ルーム選択）
      if (_dragging && _canDrag && _dragEl) {
        var vel = dx / Math.max(dt, 1);                 // px/ms
        var complete = (dx > sw * 0.32) || (dx > 60 && vel > 0.5);
        // 完了/キャンセルとも .stApp は必ず translateX(0) に戻す（画面外固着を防ぐ）。
        if (complete) {
          clearDrag(_dragEl, false);   // 瞬時クリア（戻るアニメなし）
          pDoc._danranSwipeAt = Date.now();
          fireNav('go_rooms');
        } else {
          clearDrag(_dragEl, true);    // バネ戻し
        }
        _dragging = false; _dragEl = null;
        return;
      }
      _dragging = false;

      // 非ドラッグ: 編集画面の戻る等（しきい値判定）
      if (dx > 80 && dy < dx * 0.6 && dt < 700) {
        pDoc._danranSwipeAt = Date.now();
        execSwipeFallback();
      }
    };

    // touchcancel: 通話・通知等でジェスチャー中断時も必ず .stApp を元に戻す
    var onTc = function () {
      pDoc._danranSwipeDragging = false;
      if (_dragEl) clearDrag(_dragEl, true);
      _sx = null; _dragging = false; _dragEl = null;
    };

    // 合成クリック抑制（スワイプ後 700ms）
    var onCk = function (e) {
      if (Date.now() - (pDoc._danranSwipeAt || 0) < 700) {
        e.stopImmediatePropagation();
        e.preventDefault();
      }
    };

    // アプリ復帰時にバッジをクリア
    var onVc = function () { if (!pDoc.hidden && ME) { danranClearBadge(); } };

    pDoc.addEventListener('touchstart', onTs, { passive: true });
    pDoc.addEventListener('touchmove',  onTm, { passive: false });   // preventDefault するため
    pDoc.addEventListener('touchend',   onTe, { passive: true });
    pDoc.addEventListener('touchcancel',onTc, { passive: true });
    pDoc.addEventListener('click',      onCk, { capture: true });
    pDoc.addEventListener('visibilitychange', onVc);
    pDoc._danranSwipeReg = { ts: onTs, tm: onTm, te: onTe, tc: onTc, ck: onCk, vc: onVc };
  }

  /* ════════════════════════════════════════
   *  下端で上スワイプ → リロード（プルアップ・リフレッシュ）。🔁 を表示。
   *  最新メッセージ（これ以上下に行けない）状態でさらに上に引くと refresh_chat。
   *  画像の取りこぼし等を手動で再読込できる。生きた iframe で毎 scan 貼り直す。
   * ════════════════════════════════════════ */
  function setupPullRefresh() {
    var pDoc = window.parent.document, pWin = window.parent;
    var prev = pDoc._danranPullReg;
    if (prev) {
      pDoc.removeEventListener('touchstart', prev.ts, true);
      pDoc.removeEventListener('touchmove',  prev.tm, true);
      pDoc.removeEventListener('touchend',   prev.te, true);
    }
    if (!pDoc.getElementById('_danran_spin_css')) {
      var s = pDoc.createElement('style');
      s.id = '_danran_spin_css';
      s.textContent = '@keyframes _danranSpin{from{transform:translateX(-50%) rotate(0)}' +
                      'to{transform:translateX(-50%) rotate(360deg)}}';
      (pDoc.head || pDoc.body).appendChild(s);
    }
    var sY = 0, sX = 0, atBottom = false, pulling = false, dist = 0;
    function isChat() {
      var sr = pDoc._danranSR, view = pDoc._danranView;
      return !sr && (view === 'chat' || view === '' || view === undefined);
    }
    // 実際にスクロールしている要素を特定（window でなくインナーコンテナのことがある）
    function getScroller() {
      var cands = [
        pDoc.querySelector('section.main'),
        pDoc.querySelector('[data-testid="stMain"]'),
        pDoc.querySelector('[data-testid="stAppViewContainer"]'),
        pDoc.scrollingElement, pDoc.documentElement,
      ];
      for (var i = 0; i < cands.length; i++) {
        var el = cands[i];
        if (el && el.scrollHeight > el.clientHeight + 4) return el;
      }
      return pDoc.scrollingElement || pDoc.documentElement;
    }
    function atBottomNow() {
      try {
        var sc = getScroller();
        return (sc.scrollHeight - (sc.scrollTop + sc.clientHeight)) < 14;
      } catch (e) { return false; }
    }
    function ind() {
      var el = pDoc.getElementById('_danran_pull');
      if (!el) {
        el = pDoc.createElement('div');
        el.id = '_danran_pull';
        el.textContent = '🔁';
        el.style.cssText =
          'position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:9990;' +
          'font-size:1.7rem;opacity:0;pointer-events:none;transition:opacity 0.1s;' +
          'filter:drop-shadow(0 2px 6px rgba(0,0,0,0.55));';
        pDoc.body.appendChild(el);
      }
      return el;
    }
    function hideInd() { var el = pDoc.getElementById('_danran_pull'); if (el) { el.style.opacity = '0'; el.style.animation = ''; } }
    var onTs = function (e) {
      pulling = false; dist = 0; atBottom = false;
      if (!isChat() || e.touches.length !== 1) return;
      if (pDoc.getElementById(IMG_VIEWER_ID)) return;
      sY = e.touches[0].clientY; sX = e.touches[0].clientX;
      atBottom = atBottomNow();
    };
    var onTm = function (e) {
      if (!atBottom || e.touches.length !== 1) return;
      var dy = e.touches[0].clientY - sY;
      var dx = e.touches[0].clientX - sX;
      // ★ preventDefault は一切しない（passive）。スクロールを絶対にブロックしない。
      //   下端で上に十分引いた時だけ 🔁 を出す。引きが浅い/横/下向きなら何もしない＝通常スクロール。
      if (dy < -24 && Math.abs(dy) > Math.abs(dx) + 8 && atBottomNow()) {
        pulling = true;
        dist = Math.min(-dy - 24, 110);
        var el = ind();
        el.style.opacity = String(Math.min(dist / 60, 1));
        el.style.transform = 'translateX(-50%) translateY(' + (-dist * 0.4) + 'px) rotate(' + Math.round(dist * 3) + 'deg)';
      } else if (pulling) {
        pulling = false; dist = 0; hideInd();
      }
    };
    var onTe = function () {
      if (pulling && dist > 50) {
        var el = ind();
        el.style.opacity = '1';
        el.style.transform = 'translateX(-50%)';
        el.style.animation = '_danranSpin 0.6s linear infinite';
        sendNav({ action: 'refresh_chat', ts: Date.now() });
        showToast('🔁 再読み込み中…');
        setTimeout(hideInd, 1400);
      } else {
        hideInd();
      }
      pulling = false; atBottom = false; dist = 0;
    };
    pDoc.addEventListener('touchstart', onTs, { capture: true, passive: true });
    pDoc.addEventListener('touchmove',  onTm, { capture: true, passive: true });   // passive＝スクロール非ブロック
    pDoc.addEventListener('touchend',   onTe, { capture: true, passive: true });
    pDoc._danranPullReg = { ts: onTs, tm: onTm, te: onTe };
  }

  function setupObs() {
    try {
      var body = window.parent.document.body;
      if (window._lpObs) window._lpObs.disconnect();
      window._lpObs = new MutationObserver(scan);
      window._lpObs.observe(body, { childList: true, subtree: true });
    } catch (e) {}
    setupSwipeBack();
    scan();
    setTimeout(scan, 400);
    setTimeout(scan, 1200);
    // ★ 入室カバー(スプラッシュ)の除去は scan→scrollToLatestOnEnter 駆動だが、scan は
    //   DOM 変化駆動なので描画後に変化が止まると走らず、カバーが残る（=スプラッシュで
    //   入れない）ことがある。タップした iframe のタイマーは再生成で死ぬので、
    //   「現在ライブな iframe」で定期的にカバー除去を回す（pDoc 直操作なので死んだ
    //   iframe でも実害なし。多重起動は pWin のフラグで防ぐ）。
    try {
      var pWin = window.parent;
      if (pWin._danranCoverIv) clearInterval(pWin._danranCoverIv);
      pWin._danranCoverIv = setInterval(function () {
        try { scrollToLatestOnEnter(); } catch (e) {}
        try { retryPendingRoom(); } catch (e) {}   // go_room 不達なら再送
      }, 500);
    } catch (e) {}
  }

   *  キーボード表示などで stChatInput が動いても scan() で追跡する
   * ════════════════════════════════════════ */
  function alignCamBtn() {
    try {
      var pDoc = window.parent.document;
      var pWin = window.parent;
      var btn = pDoc.getElementById(CAM_BTN_ID);
      if (!btn) return;

      // stChatInputTextArea > stChatInput > stBottom の順に探す
      var ref = pDoc.querySelector('[data-testid="stChatInputTextArea"]')
             || pDoc.querySelector('[data-testid="stChatInput"]')
             || pDoc.querySelector('[data-testid="stBottom"]');
      if (!ref) return;

      var rect = ref.getBoundingClientRect();
      var H    = pWin.innerHeight;
      var btnH = 40;

      // ref の垂直中央 (viewport 上端から) → bottom 値に変換
      var centerY  = rect.top + rect.height / 2;
      var bottomPx = Math.round(H - centerY - btnH / 2);

      // 最低 6px（画面端から落ちないように）
      btn.style.bottom = Math.max(bottomPx, 6) + 'px';
    } catch (e) {}
    alignReplyBar();   // 引用バーも入力欄に追従
  }

  /* 文字サイズ: localStorage('danran_fs') を CSS 変数 --dr-fs に適用（本文 font-size が参照）。

  function applyFontScale() {

  /* ════════════════════════════════════════
   *  チャット内インクリメンタル検索（ヘッダー🔍 → 上部に検索バー）
   *  - 表示中メッセージ(data-lp-body)を絞り込み、ヒットへ移動＋ハイライト
   *  - ↑/↓ で前後のヒット、✕ で閉じる。ハイライトは scan で再適用（2秒再描画でも維持）
   * ════════════════════════════════════════ */
  function _searchCSS(pDoc) {
    if (pDoc.getElementById('_danran_search_css')) return;
    var s = pDoc.createElement('style'); s.id = '_danran_search_css';
    s.textContent = '.dr-search-cur{outline:2px solid rgba(240,168,104,0.9);'
      + 'outline-offset:1px;border-radius:12px;}'
      + 'mark.dr-mark{background:#ffd54a;color:#1a1614;border-radius:2px;padding:0 1px;}';
    (pDoc.head || pDoc.body).appendChild(s);
  }
  function _collectMatches(pDoc, q) {
    var ids = []; if (!q) return ids;
    var ql = q.toLowerCase();
    var els = pDoc.querySelectorAll('[data-lp-msg][data-lp-body]');
    for (var i = 0; i < els.length; i++) {
      var b = (els[i].getAttribute('data-lp-body') || '').toLowerCase();
      if (b.indexOf(ql) >= 0) ids.push(els[i].getAttribute('data-lp-msg'));
    }
    return ids;   // DOM順＝古い→新しい
  }
  function _unwrapMarks(pDoc, el) {
    if (!el) return;
    var ms = el.querySelectorAll('mark.dr-mark');
    for (var i = 0; i < ms.length; i++) {
      var m = ms[i];
      if (m.parentNode) m.parentNode.replaceChild(pDoc.createTextNode(m.textContent), m);
    }
    if (ms.length) { try { el.normalize(); } catch (e) {} }
  }
  function _markText(pDoc, el, q) {
    try {
      var ql = q.toLowerCase();
      var W = pDoc.createTreeWalker(el, 4, null);   // 4 = SHOW_TEXT
      var targets = [], n;
      while ((n = W.nextNode())) {
        var v = n.nodeValue;
        if (v && v.toLowerCase().indexOf(ql) >= 0 &&
            !(n.parentNode && n.parentNode.nodeName === 'MARK')) targets.push(n);
      }
      for (var i = 0; i < targets.length; i++) {
        var node = targets[i], text = node.nodeValue, low = text.toLowerCase();
        var frag = pDoc.createDocumentFragment(), last = 0, idx;
        while ((idx = low.indexOf(ql, last)) >= 0) {
          if (idx > last) frag.appendChild(pDoc.createTextNode(text.slice(last, idx)));
          var mk = pDoc.createElement('mark'); mk.className = 'dr-mark';
          mk.textContent = text.slice(idx, idx + ql.length);
          frag.appendChild(mk); last = idx + ql.length;
        }
        if (last < text.length) frag.appendChild(pDoc.createTextNode(text.slice(last)));
        if (node.parentNode) node.parentNode.replaceChild(frag, node);

  function applySearchHighlight() {

      }

      for (var i = 0; i < pc.length; i++) pc[i].classList.remove('dr-search-cur');

      var idset = {};
      if (q && S.ids) for (var a = 0; a < S.ids.length; a++) idset[S.ids[a]] = 1;

        var mid = marked[b].getAttribute('data-lp-msg');

      if (!q || !S || !S.open || !S.ids || !S.ids.length) return;

      for (var k = 0; k < S.ids.length; k++) {

  function _searchCount(pDoc) {

  }
  function _searchGoto(pDoc, idx) {
    var S = pDoc._danranSearch; if (!S || !S.ids.length) return;

    S.idx = idx;
    var el = pDoc.querySelector('[data-lp-msg="' + S.ids[idx] + '"]');

  function _esc(s) {

    catch (e) { return escaped; }
  }
  function _dbSearch(pDoc, q) {

  function _runSearch(pDoc, q) {

    applySearchHighlight(); _searchCount(pDoc);
    // 読込済みにヒットが無ければ DB を遡って検索（デバウンス）。あれば DB パネルは隠す。
    var qq = (q || '').trim();
    var panel = pDoc.getElementById('_danran_search_db');
    if (panel && (S.ids.length || qq.length < 2)) panel.style.display = 'none';
    if (pDoc._danranDbT) clearTimeout(pDoc._danranDbT);

  function _searchStep(pDoc, dir) {
    var S = pDoc._danranSearch; if (!S || !S.ids.length) return;
    // 循環移動（末尾→先頭へラップ）。↑(-1)=古い / ↓(+1)=新しい / Return も同様

  function closeSearchBar(pDoc) {

  /* 入室時に未読があれば上部に「N件の未読」バナーを出す。タップで先頭未読へジャンプ。

  function unreadBanner() {
    try {
      var pDoc = window.parent.document;
      // チャット表示中のみ（ルーム選択・編集画面では出さない）
      if (pDoc._danranSR) return;
      var v = pDoc._danranView;
      if (v && v !== 'chat' && v !== '') return;
      var info = pDoc.getElementById('_danran_unread_info');
      if (!info) return;
      var n     = parseInt(info.getAttribute('data-count') || '0', 10);
      var first = info.getAttribute('data-first') || '';
      var room  = info.getAttribute('data-room')  || '';
      if (!n || !first) return;
      var key = room + '|' + first + '|' + n;
      pDoc._danranUnreadShownKeys = pDoc._danranUnreadShownKeys || {};
      if (pDoc._danranUnreadShownKeys[key]) return;   // この入室では表示済み
      pDoc._danranUnreadShownKeys[key] = true;

      var old = pDoc.getElementById('_danran_unread_banner'); if (old) old.remove();
      var b = pDoc.createElement('div');
      b.id = '_danran_unread_banner';
      b.style.cssText = 'position:fixed;top:60px;left:50%;'
        + 'transform:translateX(-50%) translateY(-8px);z-index:2147483600;'
        + 'background:#f0a868;color:#1a1614;font-weight:700;font-size:0.85rem;'
        + 'padding:8px 16px;border-radius:20px;box-shadow:0 6px 20px rgba(0,0,0,0.45);'
        + 'cursor:pointer;opacity:0;transition:opacity .2s,transform .2s;white-space:nowrap;'
        + '-webkit-tap-highlight-color:transparent;';
      b.textContent = '🔽 ' + n + '件の未読メッセージ';
      function dismiss() {
        b.style.opacity = '0'; b.style.transform = 'translateX(-50%) translateY(-8px)';
        setTimeout(function () { if (b.parentNode) b.remove(); }, 200);
      }
      b.addEventListener('click', function (e) {
        e.preventDefault(); e.stopPropagation();
        try { jumpToMessage(first); } catch (x) {}
        dismiss();
      });
      pDoc.body.appendChild(b);
      requestAnimationFrame(function () {
        b.style.opacity = '1'; b.style.transform = 'translateX(-50%) translateY(0)';
      });
      setTimeout(function () { if (b.parentNode) dismiss(); }, 7000);   // 自動的に引っ込む
    } catch (e) {}
  }

  /* ════════════════════════════════════════
   *  相手アバタータップ → 全画面プロフィール（写真＋名前）。LINE 風。
   *  背景タップ / ✕ で閉じる。（将来: FaceTime ボタンを足す余地あり）
   * ════════════════════════════════════════ */
  var USER_PROFILE_ID = '_danran_user_profile';
  function openUserProfile(name, avatar, coverUrl) {
    try {
      var pDoc = window.parent.document;
      if (pDoc.getElementById(USER_PROFILE_ID)) return;
      var isImg = avatar && avatar.indexOf('http') === 0;
      var ov = pDoc.createElement('div');
      ov.id = USER_PROFILE_ID;
      ov.style.cssText =
        'position:fixed;inset:0;z-index:2147483647;overflow:hidden;' +
        'display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;' +
        'background:#100d0b;animation:_danranFadeIn 0.18s ease;-webkit-tap-highlight-color:transparent;';
      // 背景レイヤー: 既定はアイコンをぼかした背景。後で cover_url があれば鮮明な背景画像に差し替える。
      var bg = pDoc.createElement('div');
      bg.style.cssText = 'position:absolute;inset:0;background-size:cover;background-position:center;';
      if (isImg) {
        bg.style.backgroundImage = 'url("' + _escHtml(avatar) + '")';
        bg.style.filter = 'blur(30px) brightness(0.4)';
        bg.style.transform = 'scale(1.25)';
      }
      ov.appendChild(bg);
      // 背景画像(cover)用の暗いグラデ（名前を読みやすく）。cover がある時だけ表示。
      var coverOverlay = pDoc.createElement('div');
      coverOverlay.style.cssText = 'position:absolute;inset:0;display:none;'
        + 'background:linear-gradient(rgba(16,13,11,0.15),rgba(16,13,11,0.78));';
      ov.appendChild(coverOverlay);
      function _applyCover(cu) {
        // bg/coverOverlay は生成済みの参照なので DOM 追加前でも適用できる（プレビューは同期適用）。
        if (!cu) return;
        bg.style.filter = 'none'; bg.style.transform = 'none';
        bg.style.backgroundImage = 'url("' + _escHtml(cu) + '")';
        coverOverlay.style.display = 'block';
      }
      // FaceTime 通話ボタン（電話番号がある相手のみ・iOS で動作）
      function _addCallButtons(phone) {
        var row = pDoc.createElement('div');
        row.style.cssText = 'position:relative;z-index:2;display:flex;gap:14px;margin-top:12px;';
        function btn(label, scheme) {

          a.style.cssText = 'display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.16);'
            + 'color:#fff;text-decoration:none;padding:10px 18px;border-radius:22px;font-size:0.95rem;'
            + 'font-weight:600;-webkit-tap-highlight-color:transparent;';
          a.addEventListener('click', function (e) { e.stopPropagation(); });   // 背景タップ閉じを抑止
          return a;
        }
        row.appendChild(btn('🎥 ビデオ', 'facetime'));
        row.appendChild(btn('🎤 音声', 'facetime-audio'));
        ov.appendChild(row);

      if (coverUrl) {
        _applyCover(coverUrl);   // プレビュー: cover を直接指定（自分→通話ボタンは出さない）
      } else {
        // 他人タップ時: cover_url と phone を名前から取得 → 背景反映＋通話ボタン
        try {
          sbGet('users?select=cover_url,phone&name=eq.' + encodeURIComponent(name || '') + '&limit=1')
            .then(function (rows) {

            }).catch(function () {});

      var av;

      close.textContent = '✕';

        'border-radius:50%;border:none;background:rgba(0,0,0,0.45);color:#fff;font-size:1.2rem;cursor:pointer;' +
        'z-index:2;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;';
      function done() { try { ov.remove(); } catch (e) {} }
      close.addEventListener('click', function (e) { e.stopPropagation(); done(); });
      ov.addEventListener('click', function () { done(); });   // 背景タップで閉じる
      ov.appendChild(av);
      ov.appendChild(nm);
      ov.appendChild(close);
      pDoc.body.appendChild(ov);
