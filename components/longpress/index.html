<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<style>body{margin:0;padding:0;background:transparent;overflow:hidden}</style>
<script>
// ── 外側シェル（Streamlit Cloud ラッパー）に PWA メタタグ + バッジ非表示 CSS を即時注入 ──
// IIFE の外で最速実行することで、Streamlit が React を描画する前に仕掛ける。
// SW 未活性（初回アクセス等）でも動作するフォールバック。
//
// 【なぜここで注入が必要か】
// Streamlit Cloud の外側シェル HTML には <link rel="manifest"> も Apple PWA メタタグも
// 含まれない。Safari はこれらを見つけられないため:
//   ① 「ホーム画面に追加」でアイコンが Streamlit デフォルト（赤紙飛行機）になる
//   ② PWA として認識されず → 通知設定・バッジが使えない
// コンポーネントは同一オリジンの親ドキュメントを DOM 操作できるため、
// ページ読み込み直後（Streamlit の React マウント前）に注入することで
// Safari が「ホーム画面に追加」を実行する時点には既に存在する。
(function () {
  try {
    // コンポーネント(window) → app iframe(parent) → 外側シェル(parent.parent)
    var ow = (window.parent && window.parent !== window)
      ? ((window.parent.parent && window.parent.parent !== window.parent)
        ? window.parent.parent : window.parent)
      : null;
    if (!ow) return;
    var od = ow.document;
    var head = od.head || od.documentElement;

    // ── PWA manifest リンク ─────────────────────────────────────────
    if (!od.querySelector('link[rel="manifest"]')) {
      var mf = od.createElement('link');
      mf.rel  = 'manifest';
      mf.href = '/manifest.json';
      head.appendChild(mf);
    }

    // ── Apple PWA メタタグ ──────────────────────────────────────────
    // apple-mobile-web-app-capable: ホーム画面から開いたとき Safari UI を非表示にする
    // apple-mobile-web-app-title:   ホーム画面アイコンの名前
    // apple-touch-icon:             ホーム画面アイコン画像
    [
      ['name', 'apple-mobile-web-app-capable',          'yes'],
      ['name', 'apple-mobile-web-app-status-bar-style', 'black-translucent'],
      ['name', 'apple-mobile-web-app-title',            'danran'],
    ].forEach(function (m) {
      if (od.querySelector('meta[' + m[0] + '="' + m[1] + '"]')) return;
      var el = od.createElement('meta');
      el[m[0]] = m[1];
      el.content = m[2];
      head.appendChild(el);
    });
    if (!od.querySelector('link[rel="apple-touch-icon"]')) {
      var ic = od.createElement('link');
      ic.rel  = 'apple-touch-icon';
      ic.href = '/icons/icon-192.png';
      head.appendChild(ic);
    }

    // ── Streamlit バッジ非表示 CSS ──────────────────────────────────
    if (od.getElementById('_danran_nobadge')) return;  // 二重注入防止
    var s = od.createElement('style');
    s.id = '_danran_nobadge';
    s.textContent =
      '[class*="viewerBadge"]{display:none!important}' +
      '[class*="hostedWith"]{display:none!important}' +
      '[class*="HostedWith"]{display:none!important}' +
      '[class*="createdBy"]{display:none!important}' +
      '[class*="CreatedBy"]{display:none!important}' +
      'a[href*="streamlit.io"]{display:none!important}';
    head.appendChild(s);
  } catch (e) {}
})();

(function () {
  'use strict';

  // 診断ログ（本番は false）。問題調査時のみ true にすると詳細ログが出る。
  // 本番でセッションID/VAPID鍵の先頭等を出さないため、log/warn はこれ経由にする。
  var DEBUG = false;
  function dlog()  { if (DEBUG) { try { console.log.apply(console, arguments); }  catch (e) {} } }
  function dwarn() { if (DEBUG) { try { console.warn.apply(console, arguments); } catch (e) {} } }

  var LP_MS           = 500;
  var STORAGE_KEY     = 'danran_session';
  var ROOM_KEY        = 'danran_last_room';   // 直前にいた部屋（sessionStorage＝再接続で復帰/完全終了で消える）
  var CHAT_IMG_BUCKET = 'chat-images';
  var CFG_ID          = '_danran_cfg';
  var CAM_BTN_ID      = '_danran_cam_btn';
  var CAM_FILE_ID     = '_danran_cam_file';
  var CAM_CSS_ID      = '_danran_cam_css';
  var LP_CSS_ID       = '_danran_lp_css';
  var POPUP_ID        = '_danran_lp_popup';
  var HDR_ID          = '_danran_hdr';
  var HDR_CSS_ID      = '_danran_hdr_css';

  // DOM config から読み込む（render イベント不要）
  var SB_URL      = '';
  var SB_KEY      = '';
  var ME          = '';
  var ME_AVATAR   = '';
  var ACTIVE_ROOM = '';
  var SHOW_ROOMS  = false;
  var VIEW        = '';     // 現在の画面（'chat'|'profile'|'room_edit'|...）
  var REPLY_ID    = '', REPLY_NAME = '', REPLY_TEXT = '', REPLY_IMG = '';  // 引用返信ターゲット
  var MENTIONS    = [];     // メンション候補 [{name, avatar, tag}] （data-mentions-json 由来）
  var ROOM_FACETIME = '';   // アクティブルームのグループ FaceTime リンク（data-room-facetime 由来）
  var AI_ROOM_NAME  = '🤖 AIサポート';   // AI ルーム名（data-ai-room で上書き）
  var AI_BOT_NAME   = '🤖 アシスタント'; // AI ボット表示名（data-ai-bot で上書き）
  var _embedFixed          = false;  // embed=true 除去リダイレクトを1回のみ実行
  var _sessionRestoreSent = false;  // restore_session postMessage を1回のみ送る
  var _gotRender          = false;  // streamlit:render を受信済みかどうか

  // Web Push
  var VAPID_PUB_KEY  = '';  // data-vapid-pub から取得
  var ME_UID         = '';  // data-uid から取得（購読保存時に使う）
  var _swRegistered  = false; // 二重登録防止

  /* ════════════════════════════════════════
   *  Streamlit コンポーネントプロトコル
   *  setValue はナビゲーションアクション時のみ送る → Python が URL params を更新
   * ════════════════════════════════════════ */
  function stPost(type, data) {
    // isStreamlitMessage: true が必須（ないと Streamlit が全メッセージを無視する）
    window.parent.postMessage(
      Object.assign({ type: type, isStreamlitMessage: true }, data || {}), '*'
    );
  }
  function stReady()     { stPost('streamlit:componentReady', { apiVersion: 1 }); }
  function stSetHeight() { stPost('streamlit:setFrameHeight', { height: 0 }); }
  // ＜/✕ ボタン → Python にナビゲーション指示（sandbox で location.href が使えないため）
  function stSetValue(val) { stPost('streamlit:setComponentValue', { value: val, dataType: 'json' }); }

  // ★ DOM 要素に1回だけ張るクリックハンドラ等は「古い iframe」が所有することがあり、
  //   その死んだ window から postMessage すると Streamlit に event.source 不一致で
  //   無視される（ルーム選択で入れない・ボタンが効かない等の原因）。
  //   scan() が毎回ライブ iframe の stSetValue を pDoc._danranSend に登録するので、
  //   ナビ送信は必ずこれ経由にする。未登録時のみ自分の stSetValue にフォールバック。
  function sendNav(val) {
    // ★ 「生きた iframe」経由(_danranSend) と 自分の stSetValue の両方で併送する。
    //   どちらの iframe が現在 active でも確実に1つは届く。active でない iframe の
    //   postMessage は Streamlit が event.source 不一致で無視し、同一 ts のため
    //   Python 側 dedup(_last_nav_ts) で1回だけ処理される＝二重実行はしない。
    //   （以前は _danranSend が古い iframe を指していると go_room が握り潰され、
    //     起動直後にルームへ入れず一覧へ戻る原因になっていた。）
    try {
      var pd = window.parent.document;
      if (pd._danranSend) pd._danranSend(val);
    } catch (e) {}
    try { stSetValue(val); } catch (e) {}
  }

  /* ════════════════════════════════════════
   *  招待リンク ?invite=CODE の転送
   *  ★ Cloudflare Worker は Streamlit を /~/+/ 配下でプロキシするため、フロントの
   *    baseUrlPath とズレて st.query_params に invite が乗らないことがある。
   *    そこで JS が「ブラウザ実URL」から invite を読み取り、Python に直接渡す。
   *    （ログイン前のみ・1回だけ。pDoc フラグで iframe 再生成をまたいでも多重送信しない）
   * ════════════════════════════════════════ */
  function forwardInviteIfAny() {
    try {
      if (ME) return;                       // ログイン済みなら不要
      var pd = window.parent.document;
      if (pd._danranInviteSent) return;     // 既に送信済み
      var search = '';
      try { search = window.top.location.search || ''; } catch (e) {}
      if (!search) { try { search = window.parent.parent.location.search || ''; } catch (e) {} }
      if (!search) { try { search = window.parent.location.search || ''; } catch (e) {} }
      var m = /[?&]invite=([^&]+)/.exec(search);
      if (!m) return;
      pd._danranInviteSent = true;
      sendNav({ action: 'set_invite', invite_code: decodeURIComponent(m[1]), ts: Date.now() });
    } catch (e) {}
  }

  /* ════════════════════════════════════════
   *  DOM config 要素から設定を読み込む
   *  Python が <div id="_danran_cfg" data-sb-url="..." ...> を
   *  st.html() で書き込む → window.parent.document から取得
   * ════════════════════════════════════════ */
  function readConfig() {
    try {
      var cfg = window.parent.document.getElementById(CFG_ID);
      if (!cfg) return false;

      var newSbUrl    = cfg.getAttribute('data-sb-url')     || '';
      var newSbKey    = cfg.getAttribute('data-sb-key')     || '';
      var newUser     = cfg.getAttribute('data-user')       || '';
      var newAvatar   = cfg.getAttribute('data-avatar')     || '';
      var newRoom     = cfg.getAttribute('data-room')       || '';
      var saveSess    = cfg.getAttribute('data-sess')       || '';
      var clearSess   = cfg.getAttribute('data-clear')      === 'true';
      var newShowRooms= cfg.getAttribute('data-show-rooms') === 'true';
      var newView     = cfg.getAttribute('data-view')       || '';
      var newVapidPub = cfg.getAttribute('data-vapid-pub')  || '';
      var newUid      = cfg.getAttribute('data-uid')        || '';
      var pushResub   = cfg.getAttribute('data-push-resub') === 'true';
      REPLY_ID   = cfg.getAttribute('data-reply-id')    || '';
      REPLY_NAME = cfg.getAttribute('data-reply-name')  || '';
      REPLY_TEXT = cfg.getAttribute('data-reply-text')  || '';
      REPLY_IMG  = cfg.getAttribute('data-reply-image') || '';
      try { MENTIONS = JSON.parse(cfg.getAttribute('data-mentions-json') || '[]'); } catch (e) { MENTIONS = []; }
      ROOM_FACETIME = cfg.getAttribute('data-room-facetime') || '';
      try { window.parent.document._danranRoomFacetime = ROOM_FACETIME; } catch (e) {}
      AI_ROOM_NAME = cfg.getAttribute('data-ai-room') || AI_ROOM_NAME;
      AI_BOT_NAME  = cfg.getAttribute('data-ai-bot')  || AI_BOT_NAME;
      // ★ 死んだ iframe 対策: 送信フックは最初の iframe が所有し、その ACTIVE_ROOM 等が stale だと
      //   AI 判定に失敗する。生きた iframe が毎回 親ドキュメントへ現在値を共有し、フック側はそれを読む。
      try {
        var _pd = window.parent.document;
        _pd._danranAiRoom = AI_ROOM_NAME;
        _pd._danranAiBot  = AI_BOT_NAME;
        _pd._danranActiveRoom = newRoom;
      } catch (e) {}
      // ★ 死んだ iframe 問題対策: メンション補完リスナは最初に張った iframe が所有する。
      //   その iframe が死ぬとローカル var MENTIONS は更新されないので、親ドキュメント
      //   経由で共有し、リスナ側は pDoc._danranMentions を都度読む。
      try { window.parent.document._danranMentions = MENTIONS; } catch (e) {}

      if (newSbUrl)    SB_URL      = newSbUrl;
      if (newSbKey)    SB_KEY      = newSbKey;
      if (newVapidPub) VAPID_PUB_KEY = newVapidPub;
      if (newUid)      ME_UID      = newUid;

      // data-push-resub="true" → ブラウザの古い購読を unsubscribe して再登録
      if (pushResub && VAPID_PUB_KEY && ME_UID) {
        forcePushResubscribe();
      }

      // セッション管理
      handleSession(saveSess, clearSess);

      // 各状態が変わったら UI を更新
      var isEditView = (newView === 'profile' || newView === 'room_edit' || newView === 'notifications' || newView === 'room_create');
      var changed = (newUser !== ME || newRoom !== ACTIVE_ROOM || newShowRooms !== SHOW_ROOMS || newView !== VIEW);
      ME          = newUser;
      ME_AVATAR   = newAvatar;
      ACTIVE_ROOM = newRoom;
      SHOW_ROOMS  = newShowRooms;
      VIEW        = newView;

      // pDoc に共有状態を書く → スワイプハンドラが複数インスタンス間で最新値を参照できる
      try {
        window.parent.document._danranView = VIEW;
        window.parent.document._danranSR   = SHOW_ROOMS;
      } catch (e) {}

      if (changed) {
        // ログアウト検出: ユーザーが消えたらヘッダー・カメラ・バッジを除去
        if (!ME) {
          removeHeader();
          removeCameraUI();
          stopBadgeTimer();
          return true;
        }
        // ログイン中はバッジタイマーを開始（多重起動防止付き）
        if (ME_UID) startBadgeTimer();
        // ヘッダーは Python 側が st.html() でレンダリング済み → JS 注入不要
        // ボタンのクリックハンドラは scan() → attachHdrButtons() が付与する
        if (isEditView || SHOW_ROOMS) {
          removeCameraUI();   // 編集画面・ルームリスト中はカメラ非表示
        } else if (ACTIVE_ROOM && ME) {
          injectCameraUI(ACTIVE_ROOM, ME_AVATAR);   // チャット画面: カメラ表示
        } else {
          removeCameraUI();
        }
      }
      return true;
    } catch (e) { return false; }
  }

  /* ════════════════════════════════════════
   *  セッション管理
   *
   *  【修正経緯】
   *  Streamlit Cloud は 3 層構造:
   *    外側シェル (/)       ← st.query_params はここの URL を読む
   *    └ app iframe (/~/+/) ← window.parent
   *        └ component     ← window (ここ)
   *
   *  以前は window.parent.location.href (app iframe) を書き換えていたため
   *  Python の st.query_params.get("s") が外側 URL を参照しており
   *  セッションが復元されなかった。
   *  → window.parent.parent (外側シェル) を書き換えることで修正。
   * ════════════════════════════════════════ */
  function handleSession(saveSession, clearSession) {
    try {
      // ① embed=true を外側 URL から除去（アドレスバー表示のみ補正）
      //    outerWin.history.replaceState は sandbox 内でも動作する
      try {
        var outerWin = (window.parent.parent && window.parent.parent !== window.parent)
                       ? window.parent.parent
                       : window.parent;
        var pUrl = new URL(outerWin.location.href);
        if (pUrl.searchParams.has('embed') && !_embedFixed) {
          _embedFixed = true;
          pUrl.searchParams.delete('embed');
          try { outerWin.history.replaceState(null, '', pUrl.toString()); } catch (e) {}
        }
      } catch (e) {}

      // ── iOS PWA warm-resume 対策 ─────────────────────────────
      //    iOS はスワイプ終了後もWebプロセスをメモリに保持して「再開」することがある。
      //    その場合 Streamlit だけ新セッションで再接続され ME は非空のまま。
      //    saveSession="" で呼ばれたら「セッションリセット」と判断し
      //    _sessionRestoreSent フラグをクリアして restore を再試行できるようにする。
      if (ME && !saveSession && !clearSession) {
        dlog('[danran] session reset detected (ME was:', ME, ') → resetting restore flag');
        _sessionRestoreSent = false;
      }

      if (clearSession) {
        localStorage.removeItem(STORAGE_KEY);
        // ── ログアウト後の blank screen 防止 ─────────────────────────
        //    clearSession=true 後は _sessionRestoreSent=true のまま stSetValue が
        //    送られず Python の _lp_result が None のままになることがある。
        //    その場合 _waiting_for_js=true で暗い画面が永続する（デッドロック）。
        //    → session_id="" の restore_session を1回だけ送り Python を unblock する。
        //    Python 側は session_id 空なら「復元不要」と判断し show_user_select() を出す。
        if (!_sessionRestoreSent) {
          _sessionRestoreSent = true;
          dlog('[danran] clearSession → firing restore_session(empty) to unblock Python');
          sendNav({ action: 'restore_session', session_id: '', ts: Date.now() });
        }
        return;
      }
      if (saveSession)  {
        localStorage.setItem(STORAGE_KEY, saveSession);
        // ログイン後は _sessionRestoreSent をリセットし、次回ログアウト時も
        // clearSession → restore_session を送れる状態にしておく
        _sessionRestoreSent = false;
        dlog('[danran] session saved to localStorage:', saveSession.slice(0, 8) + '…');
        return;
      }

      // ② 未ログイン: localStorage のセッションIDを postMessage で Python に送る
      //
      //    【v19 の失敗原因】
      //    コンポーネント初期化時の setupObs() → readConfig() → handleSession() が
      //    streamlit:render 受信 *前* に stSetValue を送ってしまうことがある。
      //    このタイミングでの stSetValue は Streamlit に無視される可能性があるが
      //    _sessionRestoreSent = true が立ってしまい、その後 render が届いた時点では
      //    再送されない → セッション復元が永遠に行われない。
      //
      //    【v21 の修正】
      //    _gotRender フラグが true（=streamlit:render を受信済み）のときのみ送る。
      //    render 受信後なら Streamlit は必ず stSetValue を受け取れる。
      // 【v23 の修正】
      //    localStorage が空でも必ず restore_session を送る。
      //    Python 側は session_id が空なら「復元不要」と判断しログインフォームを表示する。
      //    これにより Render 1（_lp_result is None）を空白画面で待機させ、
      //    Render 2 以降で正しい画面（ログイン or チャット）を表示できる。
      if (!_sessionRestoreSent && _gotRender) {
        var lsSid = localStorage.getItem(STORAGE_KEY);
        dlog('[danran] restore check: localStorage=' + (lsSid ? lsSid.slice(0, 8) + '…' : 'null') + ', ME="' + ME + '", _gotRender=' + _gotRender);
        _sessionRestoreSent = true;
        // 直前にいた部屋（120秒以内）を一緒に渡す → 復元時にその部屋へ戻す。
        //   写真ピッカーでアプリがバックグラウンド→再接続した時に一覧へ飛ばされるのを防ぐ。
        var er = '';
        try {
          var raw = sessionStorage.getItem(ROOM_KEY);
          if (raw) { var o = JSON.parse(raw); if (o && o.r && (Date.now() - (o.t || 0) < 120000)) er = o.r; }
        } catch (e) {}
        dlog('[danran] → stSetValue restore_session firing, sid=' + (lsSid ? lsSid.slice(0, 8) + '…' : '(empty)') + ', room=' + er);
        sendNav({ action: 'restore_session', session_id: lsSid || '', enter_room: er, ts: Date.now() });
      }
    } catch (e) { console.error('[danran] handleSession error:', e); }
  }

  // ── スプラッシュ固着ウォッチドッグ ───────────────────────────────────────
  //   起動時 Python は _lp_result is None の間スプラッシュ(#_danran_splash_wait)を出し、
  //   JS の restore_session 到着で解除する。だが restore_session の送信は
  //   streamlit:render 受信(_gotRender)に依存しており、その render が取りこぼされると
  //   restore_session が永久に送られず「スプラッシュのまま固着」する。
  //   → スプラッシュが一定時間出続けていたら、render を待たず restore_session を
  //     強制（再）送信してデッドロックを解除する。届くまで一定間隔で繰り返す。
  var _splashFirstSeen = 0, _splashLastKick = 0;
  function splashWatchdog() {
    try {
      var pDoc = window.parent.document;
      var sp = pDoc.getElementById('_danran_splash_wait');
      if (!sp) {                                   // スプラッシュ無し＝正常
        _splashFirstSeen = 0;
        try { sessionStorage.removeItem('_dsr'); } catch (e) {}  // 正常表示でリロード回数リセット
        return;
      }
      // ★ スプラッシュ（復元中）表示中は、前のセッションで開いていたポップアップ類を消す。
      //   iOS PWA を再開すると DOM が残ったまま再接続→スプラッシュが出るため、長押しポップアップ等が
      //   スプラッシュ上に見えてしまうバグの対策。スプラッシュ中は操作不要なので消して問題ない。
      [POPUP_ID, POPUP_BACK_ID, RMENU_ID, '_danran_emoji_picker', '_danran_link_menu',
       USER_PROFILE_ID, IMG_VIEWER_ID, '_danran_search_bar', '_danran_mention_pop'].forEach(function (id) {
        var el = pDoc.getElementById(id); if (el) el.remove();
      });
      var now = Date.now();
      if (!_splashFirstSeen) { _splashFirstSeen = now; return; }
      // ★ 久しぶりの立ち上げ(長時間バックグラウンド後の復帰)で真っ暗固着する保険。
      //   restore_session の再送だけでは復帰できない（Python/接続ごと固まっている）ことが
      //   あるので、スプラッシュが一定時間(>=9s)消えなければ手動再起動と同じく一度だけ
      //   ページをリロードして接続し直す。Worker の起動時ウォッチドッグは load 時の
      //   ワンショットで復帰時には再発火しないため、scan 駆動のここで補う。無限ループ
      //   防止に sessionStorage で最大2回まで・正常表示でカウンタ解除。
      if (now - _splashFirstSeen >= 9000) {
        var rc = 0;
        try { rc = parseInt(sessionStorage.getItem('_dsr') || '0', 10); } catch (e) {}
        if (rc < 2) {
          try { sessionStorage.setItem('_dsr', String(rc + 1)); } catch (e) {}
          dlog('[danran] splash watchdog → hard reload (stuck ' + (now - _splashFirstSeen) + 'ms)');
          try { window.parent.location.reload(); } catch (e) { try { location.reload(); } catch (e2) {} }
          return;
        }
      }
      if (now - _splashFirstSeen < 1200) return;   // 一瞬の正常スプラッシュは許容
      if (now - _splashLastKick   < 1800) return;  // 連打防止（届くまで間隔を空けて再送）
      _splashLastKick = now;
      var lsSid = '';
      try { lsSid = localStorage.getItem(STORAGE_KEY) || ''; } catch (e) {}
      var er = '';
      try {
        var raw = sessionStorage.getItem(ROOM_KEY);
        if (raw) { var o = JSON.parse(raw); if (o && o.r && (Date.now() - (o.t || 0) < 120000)) er = o.r; }
      } catch (e) {}
      _sessionRestoreSent = true;
      _gotRender = true;   // 以後の通常 handleSession も解禁しておく
      dlog('[danran] splash watchdog → force restore_session, sid=' + (lsSid ? lsSid.slice(0, 8) + '…' : '(empty)'));
      sendNav({ action: 'restore_session', session_id: lsSid, enter_room: er, ts: Date.now() });
    } catch (e) {}
  }

  // 直前にいた部屋を sessionStorage に記録（チャット表示中のみ）。一覧にいた時は消す。
  // ★ sessionStorage はアプリ完全終了で消える/バックグラウンド復帰・リロードでは残る。
  //   → アプリを落として再起動した時はルーム選択画面から開始、写真ピッカー等の一時離脱では
  //     元の部屋へ復帰、という挙動になる（localStorage だと再起動でも部屋に戻ってしまう）。
  function rememberRoom() {
    try {
      if (!ME) return;
      if (!SHOW_ROOMS && ACTIVE_ROOM && (VIEW === 'chat' || VIEW === '')) {
        sessionStorage.setItem(ROOM_KEY, JSON.stringify({ r: ACTIVE_ROOM, t: Date.now() }));
      } else if (SHOW_ROOMS) {
        sessionStorage.removeItem(ROOM_KEY);
      }
    } catch (e) {}
  }

  /* ════════════════════════════════════════
   *  Supabase REST ヘルパー
   * ════════════════════════════════════════ */
  function sbHeaders(extra) {
    return Object.assign({
      'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json',
    }, extra || {});
  }
  function sbGet(path) {
    return fetch(SB_URL + '/rest/v1/' + path, { headers: sbHeaders({ Accept: 'application/json' }) })
      .then(function (r) { return r.json(); });
  }
  function sbPost(path, body) {
    return fetch(SB_URL + '/rest/v1/' + path, {
      method: 'POST', headers: sbHeaders({ Prefer: 'return=minimal' }), body: JSON.stringify(body),
    });
  }
  function sbDelete(path) {
    return fetch(SB_URL + '/rest/v1/' + path, { method: 'DELETE', headers: sbHeaders() });
  }

  /* ════════════════════════════════════════
   *  リアクション toggle / メッセージ削除
   * ════════════════════════════════════════ */
  function toggleReaction(msgId, emoji) {
    var eu = encodeURIComponent(ME), ee = encodeURIComponent(emoji);
    return sbGet('reactions?message_id=eq.' + msgId + '&user_name=eq.' + eu + '&emoji=eq.' + ee + '&select=id')
      .then(function (rows) {
        return (Array.isArray(rows) && rows.length > 0)
          ? sbDelete('reactions?id=eq.' + rows[0].id)
          : sbPost('reactions', { message_id: msgId, user_name: ME, emoji: emoji });
      });
  }
  function deleteMsg(msgId) {
    // user_id（UUID）で認可する。user_name（表示名）は変更可能なため認可に使わない。
    // ★ return=representation で「実際に消えた行」を受け取り、0行なら失敗とみなす
    //   （fetch は 4xx でも reject しないので、件数で成否を判定する）。
    return fetch(
      SB_URL + '/rest/v1/messages?id=eq.' + msgId + '&user_id=eq.' + encodeURIComponent(ME_UID),
      { method: 'DELETE', headers: sbHeaders({ Prefer: 'return=representation', Accept: 'application/json' }) }
    ).then(function (r) {
      return r.json().then(function (rows) {
        return { ok: r.ok, count: Array.isArray(rows) ? rows.length : 0 };
      }).catch(function () { return { ok: r.ok, count: r.ok ? 1 : 0 }; });
    });
  }

   *  - [data-lp-msg] 要素から id / 送信者名 / 本文（画像なら "📷 写真"）を取り出し、
   *    Python に set_reply を送る → 入力欄の上に引用バーが出る。
   * ════════════════════════════════════════ */
  function replyTargetFromEl(el) {
    if (!el) return null;
    var id   = el.getAttribute('data-lp-msg');

    var name = el.getAttribute('data-lp-name') || '';
    var text = el.getAttribute('data-lp-body') || '';

    var imgEl = el.getAttribute('data-lp-image') ? el
              : (el.querySelector ? el.querySelector('[data-lp-image]') : null);
    var img   = imgEl ? (imgEl.getAttribute('data-lp-image') || '') : '';
    if (!text || !text.trim()) { text = img ? '📷 写真' : ''; }
    return { id: id, name: name, text: text, image: img };
  }

  /* リアクション toggle → Python に refresh_chat させて DB から綺麗に再描画。
     ★ 以前は renderPills で data-lp-react コンテナの innerHTML を直接書き換えていたが、

       消えたのと同種）。DOM は触らず Python 単一ソースで描画する。 */
  // 実際にスクロールしている要素（window or インナーコンテナ）を特定。
  function danScroller(pDoc) {
    var cands = [
      pDoc.querySelector('section.main'),
      pDoc.querySelector('[data-testid="stMain"]'),
      pDoc.querySelector('[data-testid="stAppViewContainer"]'),
      pDoc.scrollingElement, pDoc.documentElement,
    ];
    for (var i = 0; i < cands.length; i++) {
      var el = cands[i];
      if (el && el.scrollHeight > el.clientHeight + 4) return el;
    }
    return pDoc.scrollingElement || pDoc.documentElement;
  }

  // リアクションのトグル等で refresh_chat（full rerun）が走るとスクロール位置が
  // 飛ぶ。タップ時点の scrollTop を一定時間 rAF でピン留めして「動かない」ようにする。
  function startScrollHold(pDoc) {
    try {
      var sc = danScroller(pDoc);
      var already = !!pDoc._danranHoldScroll;
      pDoc._danranHoldScroll = { y: sc ? sc.scrollTop : 0, until: Date.now() + 1500 };
      if (already) return;   // ピンループは1本だけ
      var win = pDoc.defaultView || window.parent;
      (function pin() {
        try {
          var h = pDoc._danranHoldScroll;
          if (!h || Date.now() > h.until) { pDoc._danranHoldScroll = null; return; }
          var s = danScroller(pDoc);
          if (s && Math.abs(s.scrollTop - h.y) > 1) s.scrollTop = h.y;
        } catch (e) {}
        win.requestAnimationFrame(pin);
      })();
    } catch (e) {}
  }
  function extendScrollHold(pDoc) {
    try { if (pDoc._danranHoldScroll) pDoc._danranHoldScroll.until = Date.now() + 1200; } catch (e) {}
  }

  function toggleReactionAndUpdate(msgId, emoji) {
    hidePopup();
    pushRecentEmoji(emoji);   // 最近使った絵文字を学習（クイック行/ピッカー先頭に出す）
    var pDoc = window.parent.document;
    startScrollHold(pDoc);   // タップ時点の位置を保持（rerun で飛ばさない）
    toggleReaction(msgId, emoji).then(function () {
      extendScrollHold(pDoc);   // 再描画完了までピンを延長
      sendNav({ action: 'refresh_chat', ts: Date.now() });
    });
  }

  // クリップボードへコピー（iframe/PWA でも確実なよう execCommand フォールバック付き）
  function copyText(text) {
    if (!text) return;
    var nav = window.parent.navigator || navigator;
    function fallback() {
      try {
        var pDoc = window.parent.document;
        var ta = pDoc.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
        pDoc.body.appendChild(ta);
        ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
        var ok = false;
        try { ok = pDoc.execCommand('copy'); } catch (e) {}
        ta.remove();
        showToast(ok ? '📋 コピーしました' : 'コピーできませんでした');
      } catch (e) { showToast('コピーできませんでした'); }
    }
    try {
      if (nav.clipboard && nav.clipboard.writeText) {
        nav.clipboard.writeText(text)
          .then(function () { showToast('📋 コピーしました'); })
          .catch(fallback);
      } else { fallback(); }
    } catch (e) { fallback(); }
  }

  // 画像を保存（LINE 風）。iOS は共有シート経由で「画像を保存」、PC/Android は <a download>。
  function saveImage(url) {
    if (!url) return;
    try {
      var pDoc = window.parent.document;
      var nav  = window.parent.navigator || navigator;
      showToast('保存中…');
      fetch(url).then(function (r) { return r.blob(); }).then(function (blob) {
        var base = (url.split('?')[0].split('/').pop()) || 'danran';
        if (!/\.(jpe?g|png|webp|gif)$/i.test(base)) base += '.jpg';
        var file = null;
        try { file = new File([blob], base, { type: blob.type || 'image/jpeg' }); } catch (e) {}
        // iOS/モバイル: 共有シート → 「画像を保存」で写真に保存
        if (file && nav.canShare && nav.canShare({ files: [file] }) && nav.share) {
          nav.share({ files: [file] }).catch(function () {});
          return;
        }
        // フォールバック: <a download>（PC / Android）
        var a = pDoc.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = base;
        pDoc.body.appendChild(a);
        a.click();
        setTimeout(function () { try { URL.revokeObjectURL(a.href); a.remove(); } catch (e) {} }, 1500);
        showToast('📥 保存しました');
      }).catch(function () {
        // CORS 等で取得失敗 → 新規タブで開いて長押し保存を促す
        try { window.parent.open(url, '_blank'); } catch (e) {}
        showToast('長押しで保存してください');
      });
    } catch (e) { showToast('保存できませんでした'); }
  }

  // URL を既定ブラウザで開く（一時 <a target=_blank> をクリック）
  function openUrlExternal(url) {
    try {
      var pDoc = window.parent.document;
      var a = pDoc.createElement('a');
      a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
      pDoc.body.appendChild(a); a.click();
      setTimeout(function () { if (a.parentNode) a.remove(); }, 0);
    } catch (e) { try { window.parent.open(url, '_blank'); } catch (e2) {} }
  }

  // ＋ から開く絵文字ピッカー（下から出るシート・LINE風）。検索＋カテゴリ＋最近使った絵文字。

        + 'padding:10px 10px 14px;box-shadow:0 -8px 28px rgba(0,0,0,0.5);';

        + 'margin:2px auto 10px"></div>'
        + '<input id="_dr_emoji_q" type="text" inputmode="search" placeholder="🔍 絵文字を検索（例: わらう, はーと, cake）" '
        + 'style="width:100%;box-sizing:border-box;background:#1a1614;border:1px solid rgba(255,255,255,0.12);'

      card.appendChild(body);

      function gridHtml(list) {
        var h = '<div style="display:grid;grid-template-columns:repeat(8,1fr);gap:2px">';
        for (var i = 0; i < list.length; i++) {
          h += '<button data-pick="' + list[i] + '" style="background:none;border:none;'
            + 'font-size:1.7rem;padding:7px 0;cursor:pointer;border-radius:10px;'
            + '-webkit-tap-highlight-color:transparent">' + list[i] + '</button>';

      function sectionHtml(title, list) {
        if (!list.length) return '';
        return '<div style="color:rgba(240,232,224,0.45);font-size:0.72rem;font-weight:700;'
          + 'letter-spacing:0.04em;margin:10px 4px 4px">' + title + '</div>' + gridHtml(list);
      }
      function renderDefault() {
        var h = '';
        var recent = loadRecentEmoji();
        if (recent.length) h += sectionHtml('最近使った絵文字', recent.slice(0, 16));
        EMOJI_CATS.forEach(function (c) { h += sectionHtml(c.name, c.list); });
        body.innerHTML = h;

      function renderSearch(q) {
        q = q.toLowerCase().trim();
        if (!q) { renderDefault(); return; }
        var seen = {}, hits = [];
        EMOJI_PICK.forEach(function (em) {
          if (seen[em]) return;

          if (em.indexOf(q) >= 0 || kw.indexOf(q) >= 0) { seen[em] = 1; hits.push(em); }

  function showPopup(el, msgId, isMine) {
    hidePopup();
    try {
      var pDoc  = window.parent.document;
      // ★ 長押しでポップアップを開いた直後の合成 click が画像ビューアを開くのを抑止する目印。
      //   グリッドセルは data-lp-image と data-lp-msg が同一要素なので、これが無いと
      //   削除ポップアップに全画面ビューアが被さって削除操作できなくなる。
      pDoc._danranLpAt = Date.now();
      var rect  = el.getBoundingClientRect();
      var topPx = rect.top - 100;            // 2行ぶん高くなったので上に多めに退避
      if (topPx < 56) topPx = rect.bottom + 8;   // 上に入らなければメッセージの下に（ヘッダー52pxは避ける）

      var pop = pDoc.createElement('div');
      pop.id = POPUP_ID;
      pop.style.cssText =
        'position:fixed;z-index:2147483647;top:' + topPx + 'px;left:50%;transform:translateX(-50%);' +
        'background:#241f1c;border:1px solid rgba(255,255,255,0.13);border-radius:18px;' +
        'padding:7px 9px;display:flex;flex-direction:column;align-items:center;gap:6px;' +   // 絵文字=1行目/アクション=2行目
        'max-width:96vw;box-shadow:0 8px 28px rgba(0,0,0,0.6);user-select:none;-webkit-user-select:none;';
      // 2行分のコンテナ（絵文字行・アクション行）。各行は中央寄せの flex 行で折り返し可。
      var rowEmoji  = pDoc.createElement('div');
      rowEmoji.style.cssText  = 'display:flex;flex-wrap:nowrap;align-items:center;justify-content:center;gap:6px;';
      var rowAction = pDoc.createElement('div');
      rowAction.style.cssText = 'display:flex;flex-wrap:nowrap;align-items:center;justify-content:center;gap:8px;';

      function makeSep() {
        var s = pDoc.createElement('span');
        s.style.cssText = 'width:1px;height:24px;background:rgba(255,255,255,0.15);flex-shrink:0;margin:0 2px;';
        return s;
      }
      // isText=true → テキストラベル用（返信/Copy/削除）。絵文字リアクションと区別する。
      function makeBtn(label, onClick, isText) {
        var b = pDoc.createElement('button');
        b.textContent = label;
        b.style.cssText = isText
          ? 'background:rgba(255,255,255,0.08);border:none;color:#f0e8e0;font-size:0.88rem;' +
            'font-weight:600;cursor:pointer;padding:6px 11px;border-radius:12px;line-height:1;flex-shrink:0;' +
            'white-space:nowrap;-webkit-tap-highlight-color:transparent;transition:transform 0.12s;'
          : 'background:none;border:none;font-size:1.4rem;cursor:pointer;padding:3px 3px;flex-shrink:0;' +
            'border-radius:10px;line-height:1;-webkit-tap-highlight-color:transparent;transition:transform 0.12s;';
        b.addEventListener('click', function (e) { e.stopPropagation(); onClick(b); });
        b.addEventListener('touchend', function (e) { e.stopPropagation(); }, { passive: true });
        return b;
      }

      // 他人のメッセージ → 絵文字リアクション（最近＋定番 ＋ ＋でもっと選ぶ）＝1行目
      if (!isMine) {
        quickReactions().forEach(function (emoji) {
          rowEmoji.appendChild(makeBtn(emoji, function (b) {
            b.style.transform = 'scale(1.35)';
            setTimeout(function () { b.style.transform = ''; }, 140);
            toggleReactionAndUpdate(msgId, emoji);   // 即 DOM 更新
          }));
        });
        // ＋ → たくさんの絵文字から選ぶピッカー
        var plus = makeBtn('＋', function () { showEmojiPicker(msgId); });
        plus.style.opacity = '0.85';
        rowEmoji.appendChild(plus);
      }

      // 自分のメッセージ → 削除（2段階確認）＝アクション行
      if (isMine) {
        var delStage = 0;
        rowAction.appendChild(makeBtn('🗑️', function (b) {
          if (!delStage) {
            delStage = 1;
            b.textContent = '✓ 削除';
            b.style.cssText += ';color:#ff4d4d;font-size:0.82rem;font-weight:600;'
              + 'background:rgba(255,77,77,0.15);padding:5px 10px;';
          } else {
            deleteMsg(msgId).then(function (res) {
              hidePopup();
              if (!res || res.count <= 0) {
                // 実際には消えていない（認可ミス・通信失敗等）→ 成功と誤表示しない
                showToast('⚠️ 削除できませんでした');
                return;
              }
              // ★ 画像メッセージの場合: 永続プール(_danranImgPool)に残った img ノードを退避する。
              //   退避しないと、再描画後もプールの img が古いスロットに残り「削除したのに残る」
              //   ゴーストになる。JS が自前で append した img なので remove は React と競合しない。
              try {
                var pDoc2 = window.parent.document;
                var slot  = (el.getAttribute && el.getAttribute('data-lp-image'))
                  ? el
                  : (el.querySelector && el.querySelector('[data-lp-image]'));
                var url   = slot && (slot.getAttribute('data-lp-image') || slot.getAttribute('data-img'));
                if (url && pDoc2._danranImgPool && pDoc2._danranImgPool[url]) {
                  var im = pDoc2._danranImgPool[url];
                  if (im && im.parentNode) im.parentNode.removeChild(im);
                  delete pDoc2._danranImgPool[url];
                }
              } catch (e) {}
              showToast('🗑️ 削除しました');
              // ★ バブル DOM は手で触らない（display:none 等の部分操作は変化駆動描画のキャッシュと
              //   競合し、別メッセージまで一時的に消える不具合の原因）。
              //   Python に refresh_chat を投げ、DB から綺麗に再描画させる。
              sendNav({ action: 'refresh_chat', ts: Date.now() });
            });
          }
        }));
      }

      // 返信（全メッセージ）＝アクション行
      rowAction.appendChild(makeBtn('返信', function () {
        hidePopup();
        startReply(el);
      }, true));

      // Copy（テキストがあるメッセージのみ）
      var bodyText = el.getAttribute('data-lp-body') || '';
      if (bodyText.trim()) {
        rowAction.appendChild(makeBtn('Copy', function () {
          copyText(bodyText);
          hidePopup();
        }, true));
      }

      // 📌 ピン留め（全メッセージ・1ルーム1件。ルーム上部に固定表示される）
      rowAction.appendChild(makeBtn('📌 ピン', function () {
        hidePopup();
        sendNav({ action: 'pin_message', msg_id: msgId, ts: Date.now() });
      }, true));

      // 行を組み立て（絵文字があれば1行目、アクションは2行目）
      if (rowEmoji.childNodes.length) pop.appendChild(rowEmoji);
      pop.appendChild(rowAction);

      // ✕ 閉じるボタンは無し。外タップで閉じる：
      //  ① 透明バックドロップ（画面全体を覆うモーダル背面）への「新規タップ」で閉じる。
      //     長押しを開いた指の touchstart はバックドロップ生成前なので拾わず、離した時の
      //     合成 click も touchstart ではないので誤発火しない（猶予タイマー不要）。
      //  ② 念のため、生きた iframe の onTs（setupLongPressDelegation）でも外タップを判定。
      //     →「2秒ポーリングで iframe 再生成 → 旧ハンドラ凍結」でも確実に閉じる二重化。
      pDoc._danranPopupAt = Date.now();
      var back = pDoc.createElement('div');
      back.id = POPUP_BACK_ID;
      back.style.cssText = 'position:fixed;inset:0;z-index:2147483646;background:transparent;';
      back.addEventListener('touchstart', function (e) {
        e.preventDefault(); e.stopPropagation(); hidePopup();
      }, { passive: false });
      back.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); hidePopup(); });
      pDoc.body.appendChild(back);
      pDoc.body.appendChild(pop);   // pop(z:max) は back(z:max-1) の上＝ボタンはタップ可
    } catch (err) { console.error('[danran-lp] showPopup:', err); }
  }

  /* リアクションのピルを長押し → 「誰がどのスタンプを押したか」を一覧表示するポップアップ。
     データは data-lp-react コンテナの data-react-users（{emoji:[name,...]} JSON）から読む。 */
  function showReactedByPopup(pillEl) {
    hidePopup();
    try {
      var pDoc = window.parent.document;
      pDoc._danranLpAt = Date.now();   // 直後の合成 click で画像ビューア等が開くのを抑止
      var cont = pillEl.closest ? pillEl.closest('[data-lp-react]') : null;
      var raw  = cont ? (cont.getAttribute('data-react-users') || '') : '';
      var data = {};
      try { data = JSON.parse(raw) || {}; } catch (e) { data = {}; }
      var emojis = Object.keys(data);
      if (!emojis.length) return;

      var rect = pillEl.getBoundingClientRect();
      var pop  = pDoc.createElement('div');
      pop.id = POPUP_ID;
      pop.style.cssText =
        'position:fixed;z-index:2147483647;left:50%;transform:translateX(-50%);' +
        'background:#241f1c;border:1px solid rgba(255,255,255,0.13);border-radius:16px;' +
        'padding:6px 4px;min-width:170px;max-width:84vw;max-height:50vh;overflow-y:auto;' +
        'box-shadow:0 8px 28px rgba(0,0,0,0.6);user-select:none;-webkit-user-select:none;' +
        '-webkit-overflow-scrolling:touch;';
      emojis.forEach(function (em, i) {
        var names = data[em] || [];
        var row = pDoc.createElement('div');
        row.style.cssText = 'display:flex;align-items:flex-start;gap:10px;padding:8px 12px;'
          + (i > 0 ? 'border-top:1px solid rgba(255,255,255,0.07);' : '');
        var eSpan = pDoc.createElement('div');
        eSpan.textContent = em + (names.length > 1 ? ' ' + names.length : '');
        eSpan.style.cssText = 'font-size:1.25rem;flex-shrink:0;line-height:1.4;min-width:34px;';
        var nWrap = pDoc.createElement('div');
        nWrap.textContent = names.join('、');
        nWrap.style.cssText = 'color:#f0e8e0;font-size:0.9rem;line-height:1.55;word-break:break-word;';
        row.appendChild(eSpan); row.appendChild(nWrap);
        pop.appendChild(row);
      });

      // ピルの上に出す。上に入らなければ下に。
      var estH = Math.min(window.parent.innerHeight * 0.5, emojis.length * 42 + 16);
      var topPx = rect.top - 8 - estH;
      if (topPx < 12) topPx = rect.bottom + 8;
      pop.style.top = topPx + 'px';

      pDoc._danranPopupAt = Date.now();
      var back = pDoc.createElement('div');
      back.id = POPUP_BACK_ID;
      back.style.cssText = 'position:fixed;inset:0;z-index:2147483646;background:transparent;';
      back.addEventListener('touchstart', function (e) { e.preventDefault(); e.stopPropagation(); hidePopup(); }, { passive: false });
      back.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); hidePopup(); });
      pDoc.body.appendChild(back);
      pDoc.body.appendChild(pop);
    } catch (err) { console.error('[danran-lp] showReactedByPopup:', err); }
  }

  /* ════════════════════════════════════════
   *  長押し / contextmenu 検出
   * ════════════════════════════════════════ */
  function injectLpCSS() {
    try {
      var pDoc = window.parent.document;
      if (pDoc.getElementById(LP_CSS_ID)) return;
      var s = pDoc.createElement('style');
      s.id = LP_CSS_ID;
      s.textContent =
        '[data-lp-msg]{' +
        '-webkit-user-select:none;user-select:none;' +
        '-webkit-touch-callout:none;touch-action:manipulation;cursor:default;}';
      (pDoc.head || pDoc.body).appendChild(s);
    } catch (e) {}
  }

  function attach(el, msgId) {
    if (el._danranLp) return;
    el._danranLp = true;
    var isMine = el.hasAttribute('data-lp-mine');
    var timer, moved, startX, startY;
    el.addEventListener('touchstart', function (e) {
      moved = false;
      if (e.touches[0]) { startX = e.touches[0].clientX; startY = e.touches[0].clientY; }
      timer = setTimeout(function () { if (!moved) showPopup(el, msgId, isMine); }, LP_MS);
    }, { passive: true });
    el.addEventListener('touchmove', function (e) {
      if (e.touches[0]) {
        var dx = Math.abs(e.touches[0].clientX - (startX || 0));
        var dy = Math.abs(e.touches[0].clientY - (startY || 0));
        if (dx > 6 || dy > 6) { moved = true; clearTimeout(timer); }
      }
    }, { passive: true });
    el.addEventListener('touchend',    function () { clearTimeout(timer); });
    el.addEventListener('touchcancel', function () { clearTimeout(timer); });
    el.addEventListener('contextmenu', function (e) { e.preventDefault(); showPopup(el, msgId, isMine); });
  }

  /* ════════════════════════════════════════
   *  長押し（削除/リアクション）をイベント委譲で検出する。
   *  ★ 要素ごとに addEventListener する旧 attach() は「最初にバインドした iframe」が
   *    ハンドラを所有する。refresh_chat 等で iframe が再生成されると、残った要素の
   *    ハンドラ（setTimeout/showPopup）が死んだ iframe 所有のまま凍結し「長押ししても
   *    ポップアップが出ない／部屋に入り直すと直る」症状になる（= 生きた iframe 問題）。
   *  → scan() が毎回これを呼び、親 document の委譲ハンドラを「生きた iframe のもの」へ
   *    貼り直す（_danranNav と同じ考え方）。closest('[data-lp-msg]') でバブルを特定。
   * ════════════════════════════════════════ */
  function setupLongPressDelegation() {
    var pDoc = window.parent.document;
    var prev = pDoc._danranLpDeleg;
    if (prev) {   // 古い（死んだ iframe 由来かもしれない）委譲を外す
      pDoc.removeEventListener('touchstart', prev.ts, true);
      pDoc.removeEventListener('touchmove',  prev.tm, true);
      pDoc.removeEventListener('touchend',   prev.te, true);
      pDoc.removeEventListener('touchcancel',prev.tc, true);
      pDoc.removeEventListener('contextmenu',prev.cm, true);
    }
    var timer = null, moved = false, startX = 0, startY = 0, curEl = null, curPill = null;
    var rSwipe = false, rEl = null;   // 左スワイプ返信の指追従状態
    function clear() { if (timer) { clearTimeout(timer); timer = null; } }
    function fire(el) {
      // リアクションのピル上の長押しは「誰が押したか」ポップアップを優先
      if (curPill) { showReactedByPopup(curPill); return; }
      if (el) showPopup(el, el.getAttribute('data-lp-msg'), el.hasAttribute('data-lp-mine'));
    }
    function resetSwipe(spring) {
      if (rEl) {
        var e2 = rEl;
        e2.style.transition = spring ? 'transform 0.18s ease-out' : 'none';
        e2.style.transform  = 'translateX(0)';
        if (spring) setTimeout(function () {
          try { e2.style.transition = ''; e2.style.transform = ''; } catch (e) {}
        }, 200);
      }
      rSwipe = false; rEl = null;
    }
    var onTs = function (e) {
      clear(); resetSwipe(false);
      // 開いているポップアップの外をタップしたら閉じる（生きた iframe が毎回判定）。
      //   開いた直後（250ms以内）の合成タップでは閉じない。
      var pop = pDoc.getElementById(POPUP_ID);
      if (pop && !pop.contains(e.target) && Date.now() - (pDoc._danranPopupAt || 0) > 250) {
        hidePopup();
      }
      curPill = e.target && e.target.closest ? e.target.closest('[data-react-pill]') : null;
      var el = e.target && e.target.closest ? e.target.closest('[data-lp-msg]') : null;
      curEl = el; moved = false;
      if (!el && !curPill) return;
      if (e.touches && e.touches[0]) { startX = e.touches[0].clientX; startY = e.touches[0].clientY; }
      timer = setTimeout(function () { if (!moved && !rSwipe) fire(curEl); }, LP_MS);
    };
    var onTm = function (e) {
      if (!curEl || !e.touches || !e.touches[0]) return;
      var dx = e.touches[0].clientX - startX;
      var dy = e.touches[0].clientY - startY;
      if (!moved && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) { moved = true; clear(); }
      // 左スワイプ返信: 横方向が縦より優勢で左に動いたら指追従開始（ピル長押し中は無効）
      if (!rSwipe && !curPill && dx < -10 && Math.abs(dx) > Math.abs(dy) + 4) {

      if (rSwipe && rEl) {

      }
    };
    var onTe = function (e) {
      clear();
      if (rSwipe && rEl) {
        var t  = e.changedTouches && e.changedTouches[0];
        var dx = t ? (t.clientX - startX) : 0;

        if (dx < -48) { startReply(target); }   // 閾値を超えていれば返信

    };
    var onTc = function () { clear(); resetSwipe(true); moved = false; curEl = null; curPill = null; };
    var onCm = function (e) {
      var pill = e.target && e.target.closest ? e.target.closest('[data-react-pill]') : null;
      if (pill) { e.preventDefault(); showReactedByPopup(pill); return; }
      var el = e.target && e.target.closest ? e.target.closest('[data-lp-msg]') : null;
      if (el) { e.preventDefault(); fire(el); }
    };
    pDoc.addEventListener('touchstart', onTs, { capture: true, passive: true });
    pDoc.addEventListener('touchmove',  onTm, { capture: true, passive: true });
    pDoc.addEventListener('touchend',   onTe, { capture: true, passive: true });
    pDoc.addEventListener('touchcancel',onTc, { capture: true, passive: true });
    pDoc.addEventListener('contextmenu',onCm, true);
    pDoc._danranLpDeleg = { ts: onTs, tm: onTm, te: onTe, tc: onTc, cm: onCm };
  }

  /* ════════════════════════════════════════
   *  "Manage app" ボタンを非表示
   *
   *  【構造】
   *  外側シェル (streamlit.app/)           ← 管理ボタンはここ
   *    └ Streamlit app iframe (/~/+/)      ← window.parent
   *        └ コンポーネント iframe (index.html)  ← window (ここ)
   *
   *  window.parent          = Streamlit app iframe（stMainBlockContainer 等がある）
   *  window.parent.parent   = 外側シェル（管理ボタンがある）
   *
   *  CSS (st.markdown) も JS の window.parent.document も
   *  Streamlit app iframe に対してのみ効くため、外側シェルには届かなかった。
   *  → window.parent.parent.document を直接操作する必要がある。
   * ════════════════════════════════════════ */

   *  iOS「ホーム画面に追加」用メタを最上位(外側シェル)の <head> に注入する。
   *  ★ st.set_page_config / st.html の apple-touch-icon は「アプリ iframe」内にしか効かず、
   *    Safari が追加時に読むのは最上位ドキュメントの <head>。そこは Streamlit 既定の
   *    アイコン/タイトルなので「Streamlit」になってしまう。JS で最上位 head に注入して
   *    アイコン=danran、名前="danran" にする（同一オリジンなので操作可能）。
   * ════════════════════════════════════════ */

    try {
      var docs = [];
      try { if (window.parent && window.parent.document) docs.push(window.parent.document); } catch (e) {}
      try {
        var pp = window.parent && window.parent.parent;
        if (pp && pp !== window.parent && pp.document && pp.document !== window.parent.document) docs.push(pp.document);
      } catch (e) {}
      docs.forEach(function (doc) {
        var head = doc.head || (doc.getElementsByTagName('head')[0]);
        if (!head) return;
        function add(sel, make) { if (!doc.querySelector(sel)) head.appendChild(make()); }
        add('link[rel="apple-touch-icon"][data-danran]', function () {
          var l = doc.createElement('link'); l.rel = 'apple-touch-icon';
          l.setAttribute('href', '/icons/icon-192.png'); l.setAttribute('data-danran', '1'); return l;
        });
        add('meta[name="apple-mobile-web-app-title"][data-danran]', function () {
          var m = doc.createElement('meta'); m.setAttribute('name', 'apple-mobile-web-app-title');
          m.setAttribute('content', 'danran'); m.setAttribute('data-danran', '1'); return m;
        });
        add('meta[name="apple-mobile-web-app-capable"][data-danran]', function () {
          var m = doc.createElement('meta'); m.setAttribute('name', 'apple-mobile-web-app-capable');
          m.setAttribute('content', 'yes'); m.setAttribute('data-danran', '1'); return m;
        });
        add('link[rel="manifest"][data-danran]', function () {
          var l = doc.createElement('link'); l.rel = 'manifest';
          l.setAttribute('href', '/manifest.json'); l.setAttribute('data-danran', '1'); return l;
        });
      });
    } catch (e) {}
  }

  /* ════════════════════════════════════════
   *  stBottom 強制表示
   *  Streamlit React が inline style="display:none !important" を毎回設定するため
   *  scan() 内で上書きし続ける。setAttribute で cssText を置換する方式。
   * ════════════════════════════════════════ */
  var _stbObserver = null;

  function fixStBottom() {
    try {
      var pDoc = window.parent.document;
      var el   = pDoc.querySelector('[data-testid="stBottom"]');
      if (!el) return;

      var cur = el.getAttribute('style') || '';
      // display:flex かつ position:fixed がすでに設定済みなら何もしない（ループ防止）
      if (cur.indexOf('display: flex') !== -1 && cur.indexOf('position: fixed') !== -1) return;

      // position:sticky では height:0 になるケースがあるため position:fixed に強制変換
      // Streamlit dark テーマの背景色でカバー
      el.setAttribute('style',
        'display: flex !important; ' +
        'position: fixed !important; ' +
        'bottom: 0 !important; ' +
        'left: 0 !important; ' +
        'right: 0 !important; ' +
        'z-index: 100 !important; ' +
        'background: #1a1614 !important;'
      );

      // stBottom 自身の style 変更を監視（Streamlit / hideManageApp が書き戻したら即修正）
      if (!_stbObserver || el._danranObsEl !== el) {
        if (_stbObserver) _stbObserver.disconnect();
        _stbObserver = new MutationObserver(function () {
          requestAnimationFrame(fixStBottom);
        });
        _stbObserver.observe(el, { attributes: true, attributeFilter: ['style'] });
        el._danranObsEl = el;
      }
    } catch (e) {}
  }

  /* ════════════════════════════════════════
   *  自分のアバタータップ → プロフィール画面（LINE 風）
   *  [data-lp-my-avatar] 要素に click ハンドラを付与。
   *  タップ（クイック）→ click → stSetValue({action:'go_profile'})
   *  長押し → タイマーが先に発火してポップアップ表示（click は発火しない）
   * ════════════════════════════════════════ */
  /* ════════════════════════════════════════
   *  ルームリスト（カスタム HTML）のクリックハンドラ
   *  [data-room-nav]    → go_room（ルームに遷移・即 .dr-selected 付与）
   *  [data-room-gear]   → go_room_edit（ルーム編集画面へ）
   *  [data-room-create] → go_room_create（新規ルーム作成へ）
   * ════════════════════════════════════════ */
  // ★ ルームタップ等は委譲方式（document の capture click）で、毎 scan に「生きた iframe」へ
  //   貼り直す。旧方式（要素ごとに1回 addEventListener）だと、要素が古い iframe に取り残されると
  //   sendNav が死んだ iframe 経由になり go_room が届かず「スプラッシュ→一覧へ戻る」原因になった。
  function attachRoomHandlers() {
    try {
      var pDoc = window.parent.document;
      var prev = pDoc._danranRoomDeleg;
      if (prev) pDoc.removeEventListener('click', prev, true);
      var onClick = function (e) {
        var t = e.target;
        if (!t || !t.closest) return;
        // 歯車・作成はルームボタン内側にあり得るので先に判定
        var gear = t.closest('[data-room-gear]');
        if (gear) {
          e.preventDefault(); e.stopPropagation();
          try { showEditCover(); } catch (e2) {}
          sendNav({ action: 'go_room_edit', room_id: gear.getAttribute('data-room-gear'), ts: Date.now() });
          return;
        }
        var create = t.closest('[data-room-create]');
        if (create) {
          e.preventDefault(); e.stopPropagation();
          try { showEditCover(); } catch (e2) {}
          sendNav({ action: 'go_room_create', ts: Date.now() });
          return;
        }
        var nav = t.closest('[data-room-nav]');
        if (nav) {
          e.preventDefault(); e.stopPropagation();
          try { nav.classList.add('dr-selected'); } catch (e2) {}   // 即フィードバック（琥珀）
          var rname = nav.getAttribute('data-room-name');
          showEnterCover();   // 遷移全体を覆ってチラつき隠し
          // ★ コールド起動直後は WS 未確立で go_room が握り潰されることがある。
          //   入室できるまで再送するため pending を記録（retryPendingRoom が再送）。
          pDoc._danranPendingRoom = rname;
          pDoc._danranPendingAt   = Date.now();
          pDoc._danranPendingSent = Date.now();
          sendNav({ action: 'go_room', room_name: rname, ts: Date.now() });
          return;
        }
      };
      pDoc.addEventListener('click', onClick, true);
      pDoc._danranRoomDeleg = onClick;
    } catch (e) {}
  }

  // go_room が届かず一覧のままのとき、入室できるまで再送する（コールド起動の WS 未確立対策）。
  function retryPendingRoom() {
    try {
      var pDoc = window.parent.document;
      var pend = pDoc._danranPendingRoom;
      if (!pend) return;
      var sr = pDoc._danranSR;   // SHOW_ROOMS（ルーム選択中）
      // 入室できた（一覧でない & アクティブが目的の部屋）→ クリア
      if (!sr && ACTIVE_ROOM === pend) { pDoc._danranPendingRoom = null; return; }
      // 10秒で諦め（カバーは別途期限切れ掃除される）
      if (Date.now() - (pDoc._danranPendingAt || 0) > 10000) { pDoc._danranPendingRoom = null; return; }

      if (sr && Date.now() - (pDoc._danranPendingSent || 0) > 1500) {

  /* ════════════════════════════════════════
   *  Web Push — Service Worker 登録 & 購読
   *  注: コンポーネントは同一オリジンの iframe 内で動く。
   *      window.parent を通じて親ウィンドウの serviceWorker / Notification を操作する。
   *  iOS 16.4+ は PWA（ホーム画面から起動）でのみ Web Push が有効。
   * ════════════════════════════════════════ */

  /* ブラウザの古い push 購読を強制削除して新しい VAPID キーで再登録する。
   * Python の data-push-resub="true" を検知したときに呼ぶ。
   * unsubscribe() しないと同じ古い endpoint が pushManager.getSubscription() で返り続ける。
   * _pushResubInProgress フラグで二重呼び出しを防ぐ（scan() ポーリングとの race condition 対策）。
   */
  var _pushResubInProgress = false;

  function forcePushResubscribe() {
    if (_pushResubInProgress) {
      dlog('[danran] forcePushResubscribe: already in progress, skip');
      return;
    }
    _pushResubInProgress = true;
    try {
      var pWin = window.parent;
      if (!('serviceWorker' in pWin.navigator) || !('PushManager' in pWin)) {
        _pushResubInProgress = false;
        return;
      }
      var _vapidKey = VAPID_PUB_KEY;
      var _uid = ME_UID;
      dlog('[danran] forcePushResubscribe start, vapid=', _vapidKey.slice(0, 10) + '...');
      pWin.navigator.serviceWorker.ready.then(function(reg) {
        // 既存の購読を全て取得して unsubscribe
        return reg.pushManager.getSubscription().then(function(existing) {
          if (existing) {
            dlog('[danran] unsubscribing old push endpoint:', existing.endpoint.slice(-20));
            return existing.unsubscribe();
          }
          return true;
        }).then(function() {
          // 現在の VAPID 公開鍵で新規購読
          var pad = '='.repeat((4 - _vapidKey.length % 4) % 4);
          var b64 = (_vapidKey + pad).replace(/-/g, '+').replace(/_/g, '/');
          var raw = atob(b64);
          var u8  = new Uint8Array(raw.length);
          for (var i = 0; i < raw.length; i++) u8[i] = raw.charCodeAt(i);
          dlog('[danran] subscribing with new VAPID key');
          return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: u8 });
        }).then(function(sub) {
          var subJson = JSON.stringify(sub.toJSON());
          dlog('[danran] forcePushResubscribe OK, endpoint=...', sub.endpoint.slice(-30));
          // _danranSwDone をリセットして次回 injectSwSetup が正しい購読を参照できるようにする
          try { pWin._danranSwDone = null; } catch(e) {}
          sendNav({ action: 'save_push_subscription', subscription: subJson, user_id: _uid, ts: Date.now() });
        }).catch(function(err) {
          console.error('[danran] forcePushResubscribe failed:', err);
          _pushResubInProgress = false;
        });
      }).catch(function(err) {
        console.error('[danran] forcePushResubscribe SW ready failed:', err);
        _pushResubInProgress = false;
      });
    } catch (e) {
      console.error('[danran] forcePushResubscribe error:', e);
      _pushResubInProgress = false;
    }
  }

  // SW 登録・購読ヘルパーを parent window に1回だけ注入する
  function injectSwSetup() {
    try {
      var pWin = window.parent;
      // UID が変わった場合（別ユーザーがログイン）は再実行
      if (!VAPID_PUB_KEY || !ME_UID || pWin._danranSwDone === ME_UID) return;
      if (!('serviceWorker' in pWin.navigator) || !('PushManager' in pWin)) return;
      pWin._danranSwDone = ME_UID;

      // Cloudflare Worker が /sw.js をルートスコープで配信（Service-Worker-Allowed: /）
      pWin.navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .then(function (reg) { pWin._danranSwReg = reg; dlog('[danran] SW registered', reg.scope); })
        .catch(function (err) { dwarn('[danran] SW reg failed:', err); });

      // 購読ヘルパー（user gesture の応答として呼ぶ想定）
      var _vapidKey = VAPID_PUB_KEY;
      pWin._danranSubscribe = function (uid, onSub) {
        pWin.Notification.requestPermission().then(function (perm) {
          if (perm !== 'granted') return;
          pWin.navigator.serviceWorker.ready.then(function (reg) {
            // 既存の購読があれば使い回す
            return reg.pushManager.getSubscription().then(function (existing) {
              if (existing) return existing;
              // VAPID public key (URL-safe base64) → Uint8Array
              var pad = '='.repeat((4 - _vapidKey.length % 4) % 4);
              var b64 = (_vapidKey + pad).replace(/-/g, '+').replace(/_/g, '/');
              var raw = atob(b64);
              var u8  = new Uint8Array(raw.length);
              for (var i = 0; i < raw.length; i++) u8[i] = raw.charCodeAt(i);
              return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: u8 });
            });
          }).then(function (sub) {
            onSub(JSON.stringify(sub.toJSON()), uid);
          }).catch(function (err) { dwarn('[danran] push subscribe failed:', err); });
        });
      };

      // 既にユーザーが許可済みなら自動購読（バナータップ不要）
      if (pWin.Notification.permission === 'granted') {
        pWin._danranSubscribe(ME_UID, function (subJson, uid) {
          sendNav({ action: 'save_push_subscription', subscription: subJson, user_id: uid, ts: Date.now() });
        });
      }
    } catch (e) {}
  }

  /* ════════════════════════════════════════
   *  🏠 ホームアイコンバッジ（Web Badging API）
   *  iOS 16.4+ / Chrome PWA のみ対応。
   *
   *  【リアルタイム更新の仕組み】
   *  ① プッシュ通知受信時: sw.js が受信者別の未読数を即座に setAppBadge()
   *  ② アプリ復帰時: clearAppBadge()（setupSwipeBack の visibilitychange で実施）
   *  ③ バックグラウンド補完: アプリが開いているときも 30 秒ごとに Supabase から再取得
   * ════════════════════════════════════════ */
  var _badgeTimer = null;

  /* ════════════════════════════════════════
   *  バッジ設定ヘルパー
   *
   *  【iOS Permissions Policy の問題】
   *  Streamlit の <iframe> タグに allow="badging" が含まれないため、
   *  iframe 内から navigator.setAppBadge() を呼ぶと iOS で拒否される。
   *  API が navigator に存在していても Promise が reject されるケースがある。
   *  → 複数の手段を全て並行で試みる（短絡しない）。
   *
   *  【最も確実な手段: SW への postMessage】
   *  SW は TopLevel コンテキストのワーカーとして扱われ iframe 権限制限を受けない。
   *  sw.js に 'message' ハンドラを追加し、バッジ更新を依頼する。
   * ════════════════════════════════════════ */
  function danranSetBadge(n) {
    var count = (typeof n === 'number' && n > 0) ? n : 0;
    dlog('[danran] danranSetBadge(' + count + ')');

    // 手段 1: コンポーネント自身の navigator（同一オリジン iframe — 動く可能性あり）
    try {
      if ('setAppBadge' in navigator) {
        (count > 0 ? navigator.setAppBadge(count) : navigator.clearAppBadge())
          .catch(function (e) { dwarn('[danran] badge m1 reject:', e && e.message); });
      }
    } catch (e) {}

    // 手段 2: sw.js fetch インターセプターが外側 HTML に注入したヘルパー関数
    try {
      var fn = window.top._danranSetBadge;
      if (typeof fn === 'function') { fn(count); }
    } catch (e) {}

    // 手段 3: window.top.navigator 直接参照
    try {
      var topNav = window.top.navigator;
      if (topNav && 'setAppBadge' in topNav) {
        (count > 0 ? topNav.setAppBadge(count) : topNav.clearAppBadge())
          .catch(function (e) { dwarn('[danran] badge m3 reject:', e && e.message); });
      }
    } catch (e) {}

    // 手段 4: Service Worker への postMessage（最も確実 — SW は iframe 権限制約を受けない）
    try {
      var swNav = null;
      try { if (navigator.serviceWorker)             swNav = navigator.serviceWorker; } catch (ex) {}
      if (!swNav) try { swNav = window.parent.navigator.serviceWorker; } catch (ex) {}
      if (!swNav) try { swNav = window.top.navigator.serviceWorker;    } catch (ex) {}
      if (swNav) {
        swNav.ready.then(function (reg) {
          if (reg && reg.active) {
            reg.active.postMessage({ type: 'danran-set-badge', count: count });
            dlog('[danran] badge m4 SW postMessage sent, count=' + count);
          }
        }).catch(function () {});
      }
    } catch (e) {}
  }
  function danranClearBadge() { danranSetBadge(0); }

  function updateAppBadge() {
    try {
      if (!SB_URL || !SB_KEY || !ME_UID) return;

      sbGet('last_read?user_id=eq.' + ME_UID + '&select=room_name,read_at')
        .then(function (lastReads) {
          var readMap = {};
          if (Array.isArray(lastReads)) {
            lastReads.forEach(function (r) { readMap[r.room_name] = r.read_at; });
          }
          // 自分以外のメッセージのうち未読のものをカウント
          return sbGet(
            'messages?user_id=neq.' + ME_UID +
            '&select=room_name,created_at&order=created_at.desc&limit=300'
          ).then(function (msgs) {
            if (!Array.isArray(msgs)) return 0;
            var cnt = msgs.filter(function (m) {
              var r = readMap[m.room_name]; return !r || m.created_at > r;
            }).length;
            dlog('[danran] updateAppBadge unread=' + cnt + ' uid=' + ME_UID.slice(0, 8));
            return cnt;
          });
        })
        .then(function (count) { danranSetBadge(count); })
        .catch(function (e) { dwarn('[danran] updateAppBadge err:', e); });
    } catch (e) {}
  }

  function startBadgeTimer() {
    if (_badgeTimer) return;
    updateAppBadge();                                   // 即時実行
    _badgeTimer = setInterval(updateAppBadge, 30000);  // 30 秒ごと（バックグラウンド補完）
  }
  function stopBadgeTimer() {
    if (_badgeTimer) { clearInterval(_badgeTimer); _badgeTimer = null; }
    danranClearBadge();
  }

  // Python 側が描画した #_danran_push_banner のクリックイベントを付与
  function attachPushBannerClick() {
    try {
      var pWin = window.parent;
      var pDoc = pWin.document;
      var btn = pDoc.getElementById('_danran_push_banner');
      if (!btn || btn._danranPushAttached) return;
      btn._danranPushAttached = true;
      btn.addEventListener('click', function () {
        var ua = pWin.navigator.userAgent;
        var isIos = /iphone|ipad|ipod/i.test(ua);
        var isStandalone = (pWin.matchMedia('(display-mode: standalone)').matches)
                         || (('standalone' in pWin.navigator) && pWin.navigator.standalone);

        // ── iOS Safari ブラウザ（非 PWA）: まずホーム画面追加を促す ──
        if (isIos && !isStandalone) {
          _danranShowInstallSheet();
          return;
        }

        // ── Notification API 未サポート（非 iOS の非対応環境）──
        if (!('Notification' in pWin)) return;

        // ── 拒否済み（PWA 内）→ iOS 通知設定画面へ遷移 ──
        if (pWin.Notification.permission === 'denied') {
          try { pWin.location.href = 'App-Prefs:root=NOTIFICATIONS'; } catch (e) {}
          return;
        }

        // ── 未許可（PWA 内）→ requestPermission → 購読 ──
        if (!pWin._danranSubscribe || !ME_UID) return;
        pWin._danranSubscribe(ME_UID, function (subJson, uid) {
          sendNav({ action: 'save_push_subscription', subscription: subJson, user_id: uid, ts: Date.now() });
          btn.style.opacity = '0.4';
          btn.style.pointerEvents = 'none';
        });
      });
    } catch (e) {}
  }

  // Android: beforeinstallprompt をキャプチャして追加バナーを表示
  // iOS は Apple の制限により URL から自動インストール不可（ユーザー操作必須）
  function setupInstallPrompt() {
    try {
      var pWin = window.parent;
      var pDoc = pWin.document;
      if (pWin._danranInstallSetup) return;
      pWin._danranInstallSetup = true;
      // インストール済み判定
      var isStandalone = (pWin.matchMedia('(display-mode: standalone)').matches)
                       || (('standalone' in pWin.navigator) && pWin.navigator.standalone);
      if (isStandalone) return;
      pWin.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        pWin._danranInstallEvent = e;
        // Android 用インストールバナーを注入
        if (pDoc.getElementById('_danran_android_install')) return;
        var bar = pDoc.createElement('div');
        bar.id = '_danran_android_install';
        bar.style.cssText =
          'position:fixed;bottom:env(safe-area-inset-bottom,0);left:0;right:0;' +
          'background:#241f1c;border-top:1px solid rgba(255,255,255,0.1);' +
          'display:flex;align-items:center;gap:10px;padding:12px 16px;z-index:9998;';

          'color:#fff;padding:8px 16px;font-size:0.85rem;font-weight:600;cursor:pointer">追加</button>' +
          '<button id="_danran_install_dismiss" style="background:none;border:none;color:rgba(255,255,255,0.4);' +
          'font-size:1.2rem;cursor:pointer;padding:4px 8px">✕</button>';
        pDoc.body.appendChild(bar);
        pDoc.getElementById('_danran_install_btn').addEventListener('click', function () {
          if (!pWin._danranInstallEvent) return;
          pWin._danranInstallEvent.prompt();
          pWin._danranInstallEvent.userChoice.then(function (r) {
            if (r.outcome === 'accepted') bar.remove();
            pWin._danranInstallEvent = null;
          });
        });
        pDoc.getElementById('_danran_install_dismiss').addEventListener('click', function () {
          bar.remove();
        });
      });
      pWin.addEventListener('appinstalled', function () {
        var b = pDoc.getElementById('_danran_android_install');
        if (b) b.remove();
      });
    } catch (e) {}
  }

        if (pWin._danranSubscribe && ME_UID) {

            'color:#fff;font-size:0.95rem;font-weight:600;cursor:pointer;' +
            '-webkit-tap-highlight-color:transparent">⚙️ 設定アプリを開く</button>' +
